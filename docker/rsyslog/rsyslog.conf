# Ankamon log alıcısı: tahtalardan gelen syslog'u (TCP+UDP 514) Postgres'teki logs tablosuna yazar.
# Veritabanı erişilemezken kayıtlar /var/spool/rsyslog altındaki disk kuyruğunda bekler.

global(
    workDirectory="/var/spool/rsyslog"
    maxMessageSize="16k"
)

# Ana kuyruk yok: girişler doğrudan disk kuyruğuna yazar. Disk yetişemezse TCP bağlantısı okunmaz,
# tahta da kayıtlarını kendi disk kuyruğunda (TiHA: 2 GB, sınırsız yeniden deneme) tutar; alıcının
# belleğinde, güç kesilince kaybolacak bir birikim oluşmaz.
main_queue(queue.type="Direct")

module(load="imudp")
module(load="imtcp" keepAlive="on")
module(load="ompgsql")
module(load="mmutf8fix")

# option.stdsql: tek tırnakları SQL standardına göre kaçırır.
template(name="ankamon_pg" type="list" option.stdsql="on") {
    constant(value="INSERT INTO logs (received_at, device_time, host, from_ip, facility, severity, program, message) VALUES ('")
    property(name="timegenerated" dateFormat="rfc3339")
    constant(value="', '")
    property(name="timereported" dateFormat="rfc3339")
    constant(value="', '")
    property(name="hostname")
    constant(value="', '")
    property(name="fromhost-ip")
    constant(value="', ")
    property(name="syslogfacility")
    constant(value=", ")
    property(name="syslogseverity")
    constant(value=", '")
    property(name="$.program")
    constant(value="', '")
    property(name="$.msg" droplastlf="on")
    constant(value="')")
}

ruleset(name="ankamon_remote") {
    # Postgres'in reddettiği tek bir kayıt (geçersiz UTF-8) sınırsız yeniden deneme yüzünden kuyruğu
    # tıkar; bu yüzden ileti önce onarılır, program adı da yazdırılabilir ASCII'ye indirilir.
    action(type="mmutf8fix")
    # RFC3164'te ileti, etiketten sonraki boşlukla başlar; tabloya o boşluk olmadan yazılır.
    set $.msg = ltrim($msg);
    set $.program = re_extract($programname, "[!-~]+", 0, 0, "");
    action(type="ompgsql"
           server="postgres" port="5432" db="ankamon" uid="ankamon"
           pwd=`echo $PG_PASSWORD`
           template="ankamon_pg"
           # Saf disk kuyruğu: kabul edilen kayıt veritabanına yazılana dek diskte durur; alıcı durdurulsa
           # ya da öldürülse de yeniden başlayınca teslim edilir. Bellek destekli (LinkedList) kuyrukta
           # veritabanı kapalıyken alıcı durunca bellekteki pay kayboluyordu.
           queue.type="Disk"
           queue.filename="ankamon_pg"
           # Varsayılan boyut 1000 kayıttır ve dolunca yeni kayıt atılır; asıl sınır disk alanı olsun,
           # o da dolarsa kayıt atılmasın, gönderen bekletilsin.
           queue.size="5000000"
           queue.maxDiskSpace="4g"
           queue.timeoutEnqueue="600000"
           queue.dequeueBatchSize="100"
           queue.checkpointInterval="1"
           action.resumeRetryCount="-1"
           action.resumeInterval="10")
}

input(type="imudp" port="__SYSLOG_PORT__" ruleset="ankamon_remote")
input(type="imtcp" port="__SYSLOG_PORT__" ruleset="ankamon_remote")

# Alıcının kendi iletileri konteyner günlüğüne.
*.* action(type="omfile" file="/dev/stdout")
