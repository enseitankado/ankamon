# FileBrowser Quantum vekilinin ortak ayarları (nginx-default.conf'taki /filemanager/ konumları). Kimlik
# doğrulaması burada yalnız sabit bir başlıktır (proxy kimlik doğrulaması) — gerçek yetki denetimi
# auth_request'te yapılır. Yüklemeler büyük olabileceğinden gövde boyutu sınırsız, istek gövdesi
# arabelleğe alınmadan doğrudan akar.
auth_request /_auth/filemanager;
# Her Ankamon kullanıcısının kendi FileBrowser hesabı (proxy kimlik doğrulaması ilk istekte açar):
# tema gibi tercihler kullanıcıya özel — Ankamon'da kaydedilen tema açılışta buna yazılır (bkz.
# filemanager-open/index.html). Başlık yalnız oturumdan gelir; istemcininki ezilir.
auth_request_set $auth_user $upstream_http_x_auth_user;
client_max_body_size 0;
proxy_request_buffering off;
proxy_set_header X-Auth-User $auth_user;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# FileBrowser 2.x bunlara güvenir (trustProxyHeaders): istemcinin gönderdiği değerler ezilir.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 1d;
