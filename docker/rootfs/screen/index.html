<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ankamon — Cihaz ekranı</title>
<script>
  // Senkron (modül betiğinden ÖNCE çalışır — modül betiği <defer> gibi ertelenir): embed/single
  // sınıfını <html>'e HEMEN ekler. Bu olmadan tarayıcı, modül betiği devreye girip .embed'e özgü
  // küçük kutucuk ızgarasını kurmadan ÖNCE bir kare boyayabiliyordu; o karede varsayılan (tam
  // boy, koyu) #grid görünüyordu — kısa bir "maximize" parıltısı (bkz. kullanıcı bildirimi).
  try {
    var __spec = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    if (__spec.embed) {
      document.documentElement.classList.add("embed");
    } else if ((__spec.devices || []).length === 1) {
      document.documentElement.classList.add("single");
    }
  } catch (e) { /* boş/bozuk fragman: modül betiği asıl ayrıştırmayı yine yapacak */ }
</script>
<!--
  Canlı cihaz ekranı (salt izleme). Tek cihaz (q=view) ya da çoklu önizleme kutucukları (q=thumb).
  Adres: /screen/#<base64(JSON {devices:[{id,name,online,whoami?}], q})> — bilgi URL fragmanında taşınır,
  sunucuya gitmez. `whoami` varsa (bkz. Devices.js __whoamiState — "Oturumları sorgula", "Oturum aç"/"Oturumu kapat"
  sağ menülerinin tetiklediği SSH işleri) önizlemede sol altta sürmekte olan iş ("… açılıyor…") ya da
  sonuç gösterilir (bkz. Tile.setWhoami).
  Her kutucuk /screen/ws/<id> WebSocket'ine bağlanır; ekran köprüsü cihazda x11vnc'yi SSH ile başlatır.
  Kaynak tasarrufu: görünmeyen (kaydırılmış) kutucuklar ve gizli sekme bağlantıyı kapatır, görününce açar.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; font-family: Segoe UI, Roboto, sans-serif; color: #ddd; }
  body { display: flex; flex-direction: column; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #0e2a47; flex: 0 0 auto; }
  #toolbar .count { font-size: 12px; opacity: .85; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toolbar button { padding: 4px 10px; border: 0; border-radius: 4px; background: #0067c0; color: #fff; cursor: pointer; font-size: 13px; }
  #toolbar button:hover { background: #1b7ad1; }
  #grid { flex: 1; display: grid; gap: 2px; overflow: auto; min-height: 0; }
  .tile { position: relative; display: flex; flex-direction: column; background: #000; min-height: 120px; min-width: 0; }
  .tile .title { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; padding: 2px 8px; background: #1f2630; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .tile .title .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tile .title .dot { width: 8px; height: 8px; border-radius: 50%; background: #777; flex: 0 0 auto; }
  .tile.live .title .dot { background: #3c3; }
  .tile.error .title .dot { background: #e44; }
  .tile .title button { padding: 0 6px; border: 0; background: transparent; color: #ccc; cursor: pointer; font-size: 14px; }
  .tile .title button:hover { color: #fff; }
  /* Hoparlör: sarı ve belirgin; kapalıyken çizgili, açıkken dolu zemin. */
  .tile .title button.snd { display: inline-flex; align-items: center; padding: 1px 6px; color: #ffc107; border: 1px solid #ffc107; border-radius: 4px; }
  .tile .title button.snd:hover { color: #ffd54f; border-color: #ffd54f; }
  .tile .title button.snd.on { background: #ffc107; color: #1f2630; }
  .tile .title button.snd.err { color: #ff6b5e; border-color: #ff6b5e; }
  /* Klavye ve fare/dokunmatik kilidi: hoparlörle aynı biçim; kilitliyken kırmızı dolu. */
  .tile .title button.lk { display: inline-flex; align-items: center; padding: 1px 6px; color: #ffc107; border: 1px solid #ffc107; border-radius: 4px; }
  .tile .title button.lk:hover { color: #ffd54f; border-color: #ffd54f; }
  .tile .title button.lk.on { background: #d93025; border-color: #d93025; color: #fff; }
  .tile .title button.lk.busy { opacity: .5; cursor: progress; }
  .tile .view { flex: 1; min-height: 0; position: relative; }
  /* Her akış kendi katmanında (bkz. Tile.connect/reconnect): kip/kalite değişiminde yeni akış eski
     görüntünün ALTINDA kurulur, ilk karesi gelince eskisi kaldırılır — ekran kararmaz. */
  .tile .view > .screen { position: absolute; inset: 0; }
  /* Duraklatılmış akışın son karesi (bkz. Tile.freeze) — noVNC'nin ölçekli tuvaliyle aynı yerleşim. */
  .tile .view > .screen > canvas.frozen, .tile .view > .screen > img.frozen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* noVNC cihazın imlecini tuvale satır içi stil olarak yazar (salt izlemede de); müdahale kapalıyken
     görüntü alanında fare imleci değişmesin (kullanıcı isteği) — !important satır içi stili ezer. */
  .tile:not(.control) .view, .tile:not(.control) .view * { cursor: default !important; }
  .tile .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 13px; color: #bbb; pointer-events: none; }
  .tile .msg a { pointer-events: auto; color: #6af; }
  .tile.live .msg { display: none; }
  /* Ekran güç tasarrufunda: cihazın monitörü DPMS ile kapalı (üst sayfadan "powersave" — periyodik SSH
     yoklaması, bkz. Devices.js __previewList) ya da bağlı görüntü tümüyle siyah (bkz. Tile.checkBlank).
     DPMS'te x11vnc son görüntüyü vermeye devam eder: yazı koyu zeminle görüntünün üstünde; zemin arkadaki
     görüntüyü yalnız hafifçe belli edecek kadar saydam (kullanıcı isteği). Uyandırmak için sağ menü Ekran ▸ Uyandır;
     gömülü kipte DPMS'teki kutucuğun ekran alanına basmak da uyandırır (bkz. Tile.wake). */
  .tile .sleep { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 12px; font-size: 13px; color: #fff; font-weight: 600; pointer-events: none;
    background: rgba(0, 0, 0, .82); }
  .tile.live.blank .sleep, .tile.live.powersave .sleep { display: flex; }
  /* TiHA geri sayımlı otomatik kapatması: kalan süre (bkz. Tile.tickShutdown, worker executor/autoshutdown.py).
     Uyarı her zaman kutucuğun en üstünde (kullanıcı isteği); "güç tasarrufu" yazısı ortada kalır. */
  .tile .sleep .sd { position: absolute; top: 6px; left: 8px; right: 8px; font-weight: 400; font-size: 12px; color: #ffcc80; }
  .tile .sleep .sd:empty { display: none; }
  .tile .sleep .wk { margin-top: 6px; font-weight: 400; font-size: 11px; color: #ccc; }
  html.embed .tile.live.powersave:not(.control) .view, html.embed .tile.live.powersave:not(.control) .view * { cursor: pointer !important; }
  /* "Başarım" açıkken (.perf kendi koyu zeminiyle zaten örtüyor) yazı tam örtü olmaz, en üstte şerit olur:
     koyu örtü göstergeleri okunmaz kılıyordu (kullanıcı isteği). Şerit kendi yüksekliğinde (dar kutucukta sarar),
     .perf kalan alanı doldurur ve yazısı ona göre ölçeklenir — metriklerin üstüne binmez. */
  .tile.live.blank .view:has(> .perf:not([hidden])), .tile.live.powersave .view:has(> .perf:not([hidden])) {
    display: flex; flex-direction: column; }
  .tile.live.blank .view > .perf:not([hidden]), .tile.live.powersave .view > .perf:not([hidden]) {
    position: relative; inset: auto; flex: 1; min-height: 0; }
  /* position: static olmaz: mutlak konumlu .screen katmanlarının altında kalır. */
  .tile .view:has(> .perf:not([hidden])) .sleep { position: relative; z-index: 1; order: -1; flex: none; padding: 3px 8px;
    font-size: 12px; background: #000; }
  .tile .view:has(> .perf:not([hidden])) .sleep > div { display: flex; flex-direction: column; }
  .tile .view:has(> .perf:not([hidden])) .sleep .sd { position: static; order: -1; margin-bottom: 1px; font-size: 11px; }
  .tile .view:has(> .perf:not([hidden])) .sleep .wk { display: none; }
  html.single #toolbar { display: none; }
  /* Gömülü kip (Cihazlar sayfasının "Ekranlar" sekmesi): sabit oranlı küçük kutucuklar, aşağı kaydırılır.
     Sınıf <html>'e eklenir (bkz. baştaki senkron betik), body'ye değil: <body> ayrıştırılmadan önce
     de erişilebilsin diye — aksi halde ilk boyama bu kurallar uygulanmadan, FOUC ile olurdu. */
  html.embed #toolbar { display: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #888; pointer-events: none; z-index: 5; }
  /* Kutucuklar sarılan satırlarda; genişlik ortak boyuttan (alt slider, --tile-min) ya da kutucuğun kendi
     boyutundan (kenarından sürükleyerek — --w). Görüntü yüksekliği genişlikten, cihazın ekran
     çözünürlüğünün en-boy oranıyla (--ar; bilinmiyorsa 16:9) gelir. Bkz. setTileSize, Tile.setResolution. */
  html.embed #grid { display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start;
    gap: 6px; padding: 6px; background: #f3f3f3; }
  html.embed .tile { min-height: 0; border-radius: 4px; overflow: hidden; flex: none;
    width: var(--w, var(--tile-min, 300px)); max-width: 100%; }
  html.embed .tile:fullscreen { width: auto; max-width: none; }
  html.embed .tile:fullscreen .view { height: auto; }
  /* Boyutlandırma tutamaçları: sağ kenar, alt kenar, sağ alt köşe (bkz. Tile.makeResizable). */
  html.embed .tile .rs { position: absolute; z-index: 4; }
  html.embed .tile .rs-e { top: 0; right: 0; width: 6px; height: 100%; cursor: ew-resize; }
  html.embed .tile .rs-s { left: 0; bottom: 0; height: 6px; width: 100%; cursor: ns-resize; }
  html.embed .tile .rs-se { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  html.embed .tile.resizing { outline: 2px dashed #0096ff; outline-offset: -2px; }
  html.embed .tile:fullscreen .rs { display: none; }
  /* Kutucuk seçimi (Shift/Ctrl/dikdörtgen seçim) ve sürükle-bırak sıralama — yalnız gömülü kipte
     (Cihazlar sayfasının Ekranlar sekmesi). Seçim: mavi çerçeve. Sürüklenen: soluk; bırakılacak
     kutucuk: kesik çizgili çerçeve. Seçili kutucuk koyu görüntüler arasında seçilebilsin diye (kullanıcı isteği):
     dışa taşan düz mavi halka (ışıma yok), mavi başlık, başta ✓. */
  html.embed .tile.selected { outline: 3px solid #0096ff; outline-offset: -3px; z-index: 1;
    box-shadow: 0 0 0 2px #0096ff; }
  html.embed .tile.selected .title { background: #0078d4; }
  html.embed .tile.selected .title .name { color: #fff; }
  html.embed .tile.selected .title::before { content: "✓"; color: #fff; font-weight: 700; flex: 0 0 auto; }
  /* Sürüklenen kutucuk sürükleme boyunca bırakılacağı yerde durur (canlı yerleşim — bkz. dragOver):
     soluk + kesik çizgili çerçeveyle "buraya yerleşecek" yer tutucusu olarak görünür. */
  html.embed .tile.dragging { opacity: .4; outline: 3px dashed #0096ff; outline-offset: -3px; }
  /* Sürükleme yalnız başlık çubuğundan başlar (bkz. Tile dragstart) — metin seçiminin sürüklemeyle
     çakışmaması ve tutamaç olduğunun anlaşılması için. */
  html.embed .tile .title { cursor: move; user-select: none; }
  html.embed .tile .title button { cursor: pointer; }
  .marquee { position: fixed; border: 1px dashed #4af; background: rgba(70, 150, 255, .15); z-index: 999; pointer-events: none; }
  html.embed .tile .view { flex: none; aspect-ratio: var(--ar, 16 / 9); }
  /* Önizleme kutucuğu tam ekran olunca gömülü kipin sabit 16:9 kutu boyutu geçersiz kılınır —
     yoksa .view tam ekran tile'ın küçük bir köşesinde sıkışıp kanvas görünmez kalabilir. */
  .tile:fullscreen { background: #000; }
  .tile:fullscreen .view { flex: 1; aspect-ratio: auto; }
  .tile.offline .msg { color: #888; }
  /* "Kapanıyor…" yazan cihaz kapandı: kutucuk kalkmadan önce CLOSED_NOTE_MS "Kapandı" (bkz. Tile.showClosed). */
  .tile.closed .msg { color: #fff; font-size: 16px; font-weight: 600; }
  /* Ekranı ayrı pencerede açık cihaz (Devices.js "tm-popped"): önizleme akışı durur, yerine bu not. */
  .tile.popped .msg { color: #8cf; font-size: 14px; font-weight: 600; }
  /* Önizlemede (q=thumb) oturum durumu — "Oturumları sorgula" sonucu ve "Oturum aç"/"Oturumu kapat"
     ilerlemesi; sol alt köşe, siyah zemin beyaz yazı. Bkz. Tile.setWhoami / Devices.js __whoamiState. */
  /* Birden fazla oturum varsa adlar oturum açma sırasıyla virgülle gelir ("ali, veli" — bkz. worker
     executor/whoami.py); sığmazsa en çok iki satıra sarılır, fazlası "…" ile kesilir. */
  .tile .whoami { position: absolute; left: 4px; bottom: 4px; max-width: calc(100% - 8px); overflow: hidden;
    padding: 3px 8px; border-radius: 3px; background: #000; color: #fff;
    font-size: 14px; font-weight: 600; line-height: 1.25; pointer-events: none;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  .tile .whoami[hidden] { display: none; }
  .tile .whoami.querying { font-style: italic; }
  /* Sürmekte olan iş (oturum aç/kapat, kilitle, uyut…): yazının önünde dönen halka — durağan yazı işin
     ilerlediği hissini vermiyordu (panelde aynısı: ui.JobSpinner). */
  .tile .whoami.querying::before { content: ""; display: inline-block; box-sizing: border-box; width: .85em;
    height: .85em; margin-right: 6px; vertical-align: -.1em; border: 2px solid currentColor;
    border-right-color: transparent; border-radius: 50%; animation: whoami-job-spin .9s linear infinite; }
  @keyframes whoami-job-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tile .whoami.querying::before { animation-duration: 2.4s; } }
  .tile .whoami.error { background: rgba(140, 20, 20, .75); }
  /* Alt bar (yalnız Ekranlar sekmesi — gömülü kip): üst başlık çubuğunun aynısı; cihazın son
     işlemci/bellek kullanımı ve işlemci sıcaklığı (bkz. Tile.setStats, Devices.js __previewList).
     Eşik aşılınca değer turuncu/kırmızı olur. */
  .tile .stats { display: none; }
  html.embed .tile .stats { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 0 10px; align-items: center; padding: 2px 8px;
    background: #1f2630; font-size: 12px; white-space: nowrap; overflow: hidden; }
  html.embed .tile:fullscreen .stats { display: none; }
  .tile .stats .k { opacity: .65; margin-right: 3px; }
  .tile .stats .warn { color: #ffb74d; }
  .tile .stats .crit { color: #ff6b6b; font-weight: 600; }
  .tile .stats .none { opacity: .55; }
  /* Ağ arabirimleri (bkz. Tile.netIcons): barın solunda; etkin yeşil, değilse gri; ipucunda özellikler/yapılandırma. */
  .tile .stats .net { display: inline-flex; gap: 6px; align-items: center; }
  .tile .stats .net svg { width: 15px; height: 15px; display: block; color: #6e7681; cursor: help; }
  .tile .stats .net svg.up { color: #3fb950; }
  /* Ekranlar araç çubuğunun "Donanım" düğmesi kapalıyken alt bar gizlenir (bkz. tm-view). */
  html.embed.nostats .tile .stats { display: none; }
  /* "Başarım" görünümü: htop'un üst sol (çekirdek başına CPU, Mem, Swp) ve sağ (görevler, yük,
     çalışma süresi) panelleri ekran önizlemesinin üstünde, saniyelik (bkz. Tile.renderPerf,
     worker/ankamon/screen/perf.py). Yazı kutucukla ölçeklenir (container query); satır çoksa
     (--rows) yüksekliğe sığacak kadar küçülür. Ekran katmanlarının üstünde, .msg/.whoami'nin altında. */
  .tile .perf { position: absolute; inset: 0; container-type: size; pointer-events: none;
    background: rgba(8, 12, 18, .8); color: #e6edf3; font-family: "DejaVu Sans Mono", ui-monospace, monospace; }
  .tile .perf[hidden] { display: none; }
  .tile .perf .in { display: grid; grid-template-columns: 1.15fr 1fr; gap: 0 4cqw; padding: 2.5cqh 3cqw;
    font-size: clamp(6px, min(2.8cqw, calc(88cqh / var(--rows, 6) / 1.3)), 22px); line-height: 1.3; }
  .tile .perf .row { display: flex; align-items: center; gap: .45em; white-space: nowrap; min-width: 0; }
  .tile .perf .lbl { flex: none; width: 2.2em; text-align: right; color: #58a6ff; }
  .tile .perf .bar { flex: 1; min-width: 2em; height: .8em; display: flex; overflow: hidden; border-radius: 2px; background: #2a313c; }
  .tile .perf .bar i { display: block; height: 100%; }
  .tile .perf .v { flex: none; min-width: 3.3em; text-align: right; }
  .tile .perf .u { background: #3fb950; }   /* kullanıcı / kullanılan bellek */
  .tile .perf .n { background: #58a6ff; }   /* nice / tampon */
  .tile .perf .s { background: #f85149; }   /* sistem (+irq) */
  .tile .perf .o { background: #8b949e; }   /* iowait + steal */
  .tile .perf .c { background: #d29922; }   /* önbellek */
  .tile .perf .r .row { display: block; overflow: hidden; text-overflow: ellipsis; }
  .tile .perf .k { color: #58a6ff; }
  .tile .perf .hi { color: #f85149; font-weight: 600; }
  .tile .perf .wait { grid-column: 1 / -1; opacity: .7; }
  /* Donanım satırı (işlemci/RAM/disk — Devices.js __hwSummary): göstergelerin üstünde, en çok 2 satır. */
  /* Alt iç boşluk YOK: overflow iç boşluğu kırpmaz, 3. satırın üst kenarı orada görünürdü. */
  .tile .perf .hw { grid-column: 1 / -1; margin-bottom: .45em; border-bottom: 1px solid #3a4250;
    color: #d2a8ff; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  #empty { margin: 40px; color: #888; }
  .tile .title button.ctl.on { color: #fff; background: #c62828; border-radius: 3px; }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="count" id="count"></span>
    <button id="full" title="Bütün sayfayı tam ekran yapar">⛶ Tam ekran</button>
  </div>
  <div id="grid"></div>
  <!-- Kutucuklar kurulana dek (noVNC modülleri + üst sayfadan cihaz listesi) ortada görünür; bkz. markLoaded. -->
  <div id="loading">Yükleniyor…</div>

<script type="module">
import RFB from "./novnc/core/rfb.js";

const PROFILE = {
  view:  { quality: 6, compression: 2, retry: 4000 },
  // Sohbet açıkken: cihazdaki sohbet penceresinin yazısı okunsun (tam çözünürlük, yüksek kalite; bkz. Tile.applyQuality).
  chat:  { quality: 8, compression: 2, retry: 4000 },
  thumb: { quality: 4, compression: 6, retry: 15000 }
};
const MESSAGES = {
  4001: "Cihaz kaydı ya da IP adresi bulunamadı.",
  4002: "Cihaza SSH ile ulaşılamadı (kapalı ya da ağda değil). Yeniden deneniyor…",
  4003: "SSH girişi reddedildi — Ayarlar'daki SSH kullanıcı/parolasını denetleyin.",
  4004: "Cihazda ekran istemcisi (x11vnc) kurulu değil. Hazır işlemlerden \"Ekran istemcisini (x11vnc) kur\"u çalıştırın ya da Ayarlar → Cihaz erişimi'nde otomatik kurulumu açın.",
  4005: "Ekran paylaşımı başlatılamadı",
  // Köprü x11vnc yokken kurulumu arka planda başlattı (ayar: "Ekran istemcisini otomatik kur").
  4006: "İstemci yükleniyor…",
  4007: "Ekran istemcisi (x11vnc) otomatik kurulamadı — ayrıntı Arka plan işlemleri'nde. Bir süre sonra yeniden denenecek.",
  4029: "Eşzamanlı izleme sınırına ulaşıldı.",
  4030: "Fare/klavye ile müdahale yetkiniz yok (yönetici \"Cihaz ekranını uzaktan yönetme\" yetkisini verebilir).",
  4900: "Bağlantı zaman aşımına uğradı. Yeniden deneniyor…"   // istemci tarafı (bkz. Tile.CONNECT_TIMEOUT_MS)
};
const FINAL = new Set([4001, 4003, 4004, 4029, 4030]);   // kendiliğinden yeniden denenmez

let spec = { devices: [], q: "view" };
try {
  spec = Object.assign(spec, JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))));
} catch (e) { /* boş/bozuk fragman */ }
const embed = !!spec.embed;   // Cihazlar sayfasının "Ekranlar" sekmesi: liste üst sayfadan güncellenir
// Ekranlar araç çubuğunun aç/kapa düğmeleri (üst sayfadan "tm-view"): alt donanım barı, başarım görünümü.
// Gömülü (Ekranlar sekmesi) görünümde Sensörler barı varsayılan kapalı (kullanıcı isteği 2026-11-13); üst sayfa tm-ready
// sonrası kullanıcının kayıtlı seçimini tm-view ile gönderir — bar açılışta bir an görünüp kaybolmasın.
const view = { stats: !embed, perf: false };
if (embed) document.documentElement.classList.add("nostats");
const single = !embed && spec.devices.length === 1;
// Sınıflar normalde baştaki senkron betikte zaten eklenir (FOUC önleme); burada tekrar eklemek
// zararsız (idempotent) ve hash'in o betikte beklenmedik şekilde ayrıştırılamadığı bir durum için güvence.
if (single) document.documentElement.classList.add("single");
if (embed) document.documentElement.classList.add("embed");
document.getElementById("count").textContent =
  spec.devices.length + " cihaz" + (spec.q === "thumb" ? " · önizleme" : "") + " · çift tıkla: tam ekran";

const grid = document.getElementById("grid");
if (!embed) {
  const cols = Math.max(1, Math.ceil(Math.sqrt(spec.devices.length)));
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  grid.style.gridAutoRows = `minmax(0, 1fr)`;
}

// Kilit düğmesi simgeleri: Tabler Icons (MIT, github.com/tabler/tabler-icons, © 2020-2026 Paweł Kuna; LICENSES/MIT.txt).
const LINE_ICON = paths => `<svg viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>${paths}</svg>`;
const KEYBOARD_ICON = LINE_ICON("<path d='M2 8a2 2 0 0 1 2 -2h16a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2l0 -8'/><path d='M6 10l0 .01'/><path d='M10 10l0 .01'/><path d='M14 10l0 .01'/><path d='M18 10l0 .01'/><path d='M6 14l0 .01'/><path d='M18 14l0 .01'/><path d='M10 14l4 .01'/>");
const MOUSE_ICON = LINE_ICON("<path d='M6 7a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-4a4 4 0 0 1 -4 -4l0 -10'/><path d='M12 7l0 4'/>");
// Hoparlör simgeleri: yazı tipi emojisi CSS rengini almaz, sarı görünmesi için çizim.
const SPEAKER_OFF = "<svg viewBox='0 0 24 24' width='18' height='18' fill='currentColor' aria-hidden='true'><path d='M3 9v6h4l5 5V4L7 9H3z'/><path d='M16 9l5 6m0-6l-5 6' stroke='currentColor' stroke-width='2' fill='none'/></svg>";
const SPEAKER_ON = "<svg viewBox='0 0 24 24' width='18' height='18' fill='currentColor' aria-hidden='true'><path d='M3 9v6h4l5 5V4L7 9H3z'/><path d='M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12' stroke='currentColor' stroke-width='2' fill='none' stroke-linecap='round'/></svg>";

class Tile {
  constructor(device) {
    this.device = device;
    this.base = spec.q in PROFILE ? spec.q : "view";
    this.q = chatting.has(device.id) ? "chat" : this.base;
    this.isFs = false;        // kutucuk tam ekranda
    this.wanted = false;      // görünür + sekme açık + cihaz çevrimiçi (ilk refreshWanted bağlar)
    this.inView = true;       // kutucuk görünür alanda (IntersectionObserver)
    this.rfb = null;
    this.timer = null;
    this.el = document.createElement("div");
    this.el.className = "tile";
    this.el._deviceId = device.id;   // orderedIds() DOM sırasını buradan okur
    this.control = false;     // fare/klavye ile müdahale (yalnız "screen.control" yetkisiyle; sunucu da denetler)
    this.el.innerHTML = `<div class="title"><span class="dot"></span><span class="name"></span>
      ${embed ? "" : `<button class="snd" title="Cihazın sesini bu bilgisayara aktar (kapalı)">${SPEAKER_OFF}</button>`}
      ${!embed && spec.input ? `<button class="lk" data-device="keyboard">${KEYBOARD_ICON}</button><button class="lk" data-device="mouse">${MOUSE_ICON}</button>` : ""}
      ${spec.control ? '<button class="ctl" title="Fare ve klavye ile cihazı yönet (aç/kapat)">🖱 Müdahale</button>' : ""}
      <button class="fs" title="Tam ekran">⛶</button></div><div class="view"><div class="perf" hidden><div class="in"></div></div><div class="msg">Bağlanıyor…</div><div class="sleep"><div>Ekran güç tasarrufu kipinde<div class="sd"></div>${embed ? '<div class="wk">Uyandırmak için tıklayın</div>' : ""}</div></div>
      <div class="whoami" hidden></div></div><div class="stats"></div>`;
    this.el.querySelector(".name").textContent = device.name || ("#" + device.id);
    this.view = this.el.querySelector(".view");
    this.msg = this.el.querySelector(".msg");
    this.whoamiEl = this.el.querySelector(".whoami");
    this.statsEl = this.el.querySelector(".stats");
    this.sdEl = this.el.querySelector(".sleep .sd");
    this.perfEl = this.el.querySelector(".perf");
    this.perfIn = this.el.querySelector(".perf .in");
    this.perfWs = null;
    this.perfTimer = null;
    this.refreshNonce = device.refresh || 0;
    this.setWhoami(device.whoami);
    this.setStats(device.stats);
    this.el.classList.toggle("powersave", !!device.powersave);
    this.tickShutdown();
    this.el.querySelector("button.fs").addEventListener("click", () => toggleFullscreen(single ? document.documentElement : this.el));
    const snd = this.el.querySelector("button.snd");
    if (snd) snd.addEventListener("click", () => this.setAudio(!this.audioWs));
    this.locks = device.locks || [];
    this.el.querySelectorAll("button.lk").forEach(btn => btn.addEventListener("click", () => this.toggleLock(btn)));
    this.showLocks();
    const ctl = this.el.querySelector("button.ctl");
    // Müdahale tam ekranda yapılır (kullanıcı isteği): Ekranlar sekmesinde (gömülü) kutucuğun kendisi değil,
    // o cihazın "Ekranı yönet" penceresi büyütülmüş açılır (üst sayfa — bkz. Devices.js "tm-manage"); ekran
    // penceresinin içinde açılınca pencere büyütülür (bkz. DeviceOps.screen "tm-maximize").
    if (ctl) ctl.addEventListener("click", () => {
      if (embed) {
        window.parent.postMessage({ type: "tm-manage", id: this.device.id }, location.origin);
        return;
      }
      this.setControl(!this.control);
      if (this.control) window.parent.postMessage({ type: "tm-maximize" }, location.origin);
    });
    // Güç tasarrufundaki ekrana basmak onu uyandırır (gömülü kip; seçim/çift tıklama da aynen sürer).
    if (embed) {
      this.el.addEventListener("pointerdown", e => {
        if (e.button === 0 && !this.control && e.target.closest(".view")) this.wake();
      }, true);
    }
    // Müdahale kipinde çift tıklama cihaza gider; tam ekran yalnız ⛶ düğmesiyle.
    // Gömülü kipte (Ekranlar sekmesi) ekran alanına çift tıklama sağ menüdeki "Ekranı göster" ile aynı
    // işi yapar (kullanıcı isteği; üst sayfa açar — bkz. Devices.js "tm-show"); başlık çubuğuna çift
    // tıklama ve tam ekrandayken çift tıklama tam ekranı aç/kapatır. Ekran alanındaki çift tıklama
    // tarayıcının "dblclick"i ile YAKALANAMAZ: noVNC tuvalde basılınca bütün sayfayı kaplayan bir
    // yakalama katmanı açıyor, "dblclick" kutucuğa değil BODY'ye düşüyor (ölçüldü) — bu yüzden aşağıdaki
    // yakalama aşamasındaki pointerdown'dan (400 ms içinde iki basış) algılanır.
    const viewDouble = e => embed && !document.fullscreenElement && e.target.closest(".view");
    this.el.addEventListener("dblclick", e => {
      if (this.control || viewDouble(e)) return;
      toggleFullscreen(single ? document.documentElement : this.el);
    });
    this.el.addEventListener("pointerdown", e => {
      if (e.button !== 0 || this.control || !viewDouble(e) || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const now = Date.now();
      if (now - (this.viewDownAt || 0) < 400) {
        this.viewDownAt = 0;
        window.parent.postMessage({ type: "tm-show", id: this.device.id }, location.origin);
      } else {
        this.viewDownAt = now;
      }
    }, true);
    // Gömülü kipte sağ tık, Cihazlar grid'inin satır menüsüyle AYNI menüyü açar: menü üst sayfada
    // (qooxdoo, Devices.__rowMenu) kurulur — burada yalnız cihaz kimliği, o anki çoklu seçim ve konum
    // iletilir (bkz. Devices.__openPreviewMenu). Müdahale kipinde sağ tık cihaza gider.
    if (embed) {
      // Yakalama aşamasında dinlenir: noVNC tuvali olayı kendisi durdurduğu için kabarcıklanma aşamasına ulaşmıyor.
      this.el.addEventListener("contextmenu", e => {
        if (this.control) return;
        e.preventDefault();
        e.stopPropagation();
        // Seçim dışı bir kutucuğa sağ tıklanırsa (çoğu dosya yöneticisindeki gibi) seçim ona
        // sıfırlanır; zaten seçimin bir parçasıysa (Shift/Ctrl ile yapılmış) seçim KORUNUR.
        if (!selected.has(this.device.id)) setSelected([this.device.id]);
        // Alt barda sağ tık: hangi göstergelerin görüneceği (bkz. Devices.__openStatsMenu); başka yerde cihaz menüsü.
        const type = e.target.closest && e.target.closest(".stats") ? "tm-statsmenu" : "tm-menu";
        window.parent.postMessage(
          { type, id: this.device.id, ids: [...selected], x: e.clientX, y: e.clientY }, location.origin);
      }, true);
      // Basınca seçilir (görüntü alanı dahil — müdahale kipinde değilse): düz basış bu kutucuğu TEK
      // seçili yapar; Ctrl/⌘ tekli ekler/çıkarır; Shift, son seçilenden buna kadarki (görünür DOM
      // sırasındaki) aralığı seçer. "click" değil "pointerdown": noVNC tuvalde basılınca bütün sayfayı
      // kaplayan bir yakalama katmanı açıyor (novnc/core/util/events.js setCapture), bırakma o katmanda
      // olduğundan "click" kutucuğa hiç ulaşmıyor. Yakalama aşaması: tuvalin kendi dinleyicilerinden önce.
      // Zaten çoklu seçimin parçası olan kutucuğa düz basışta seçim hemen daraltılmaz — sürükleme
      // başlamazsa bırakınca daraltılır (Explorer'daki gibi; çoklu seçimi bozmadan sürüklenebilsin).
      this.makeResizable();
      this.el.addEventListener("pointerdown", e => {
        if (e.button !== 0 || this.control || e.target.closest("button") || e.target.closest(".rs")) return;
        const id = this.device.id;
        const ids = orderedIds();
        if (e.shiftKey && selectAnchor !== null && ids.includes(selectAnchor)) {
          const a = ids.indexOf(selectAnchor);
          const b = ids.indexOf(id);
          setSelected(ids.slice(Math.min(a, b), Math.max(a, b) + 1));
          return; // çapa yerinde kalır: Shift ile aralık genişletilebilir
        }
        selectAnchor = id;
        if (e.ctrlKey || e.metaKey) {
          toggleSelected(id);
        } else if (selected.has(id) && selected.size > 1) {
          // Her basışın kendi jetonu: sürükleme bırakmayı (pointerup) yutarsa kalan eski dinleyici
          // sonraki bir basışın bekleyen daraltmasını yanlışlıkla iptal etmesin.
          const token = pendingCollapse = { id };
          document.addEventListener("pointerup", () => {
            if (pendingCollapse !== token) return;
            pendingCollapse = null;
            setSelected([id]);
          }, { once: true, capture: true });
        } else {
          setSelected([id]);
        }
      }, true);
      // Sürükle-bırak yeniden sıralama: yalnız BAŞLIK ÇUBUĞUNDAN (düğmeler hariç) tutup sürüklenir.
      // Görüntü alanı (noVNC tuvali) KESİNLİKLE sürükleme başlatamaz: RFB kendi "mousedown"
      // dinleyicisini tuvale doğrudan bağlıyor ve HER ZAMAN preventDefault()+stopPropagation()
      // çağırıyor (bkz. novnc/core/rfb.js _connect/handleMouse — viewOnly'de de, FIXME yorumuyla
      // kendileri de belirtmiş) — bu, tarayıcının yerel sürükleme başlatma hareketini (mousedown+
      // hareket) o alanda baştan engelliyor; title.css'teki user-select:none de metin SEÇİMİNİN
      // sürüklemeyle çakışmasını (adın üstüne tam basınca bazen metin seçimi "kazanabiliyor") önler.
      // dragstart'ın hedefi HER ZAMAN draggable öğenin kendisidir (.tile) — basılan alt öğe değil;
      // bu yüzden "başlıktan mı tutuldu" bilgisi basış anında (pointerdown, yakalama aşaması) saklanır.
      this.el.draggable = true;
      this.el.addEventListener("pointerdown", e => {
        this.dragArmed = !!e.target.closest(".title") && !e.target.closest("button");
      }, true);
      this.el.addEventListener("dragstart", e => {
        if (!this.dragArmed) {
          e.preventDefault();
          return;
        }
        pendingCollapse = null; // sürükleme başladı: çoklu seçim bırakınca daraltılmasın
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", String(this.device.id));
        dragStart(this);
      });
      this.el.addEventListener("dragend", () => {
        this.dragArmed = false;
        dragEnd();
      });
      // Canlı yerleşim: sürüklenen kutucuk üzerinden geçilen kutucuğun yerine HEMEN taşınır, diğerleri
      // kayarak yer açar (bkz. dragOver). Bırakma yeri ayrıca işaretlenmez — kutucuk zaten oradadır.
      this.el.addEventListener("dragover", e => {
        if (!drag) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        dragOver(this);
      });
    }
        grid.appendChild(this.el);
  }

  /**
   * Gömülü kipte kutucuk kenarından boyutlandırılır (kullanıcı isteği): sağ kenar, alt kenar ya da köşe —
   * hangisinden sürüklenirse sürüklensin en-boy oranı korunur (cihazın ekran çözünürlüğü, bkz.
   * setResolution); yalnız ölçek değişir. Köşede iki yöndeki sürüklemeden büyük olanı geçerlidir.
   * Boyut (genişlik) cihaz başına bu tarayıcıda saklanır; alt slider (setTileSize reset) hepsini ortak boyuta döndürür.
   */
  makeResizable() {
    ["e", "s", "se"].forEach(dir => {
      const h = document.createElement("div");
      h.className = "rs rs-" + dir;
      h.title = "Sürükleyerek boyutlandırın";
      h.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        h.setPointerCapture(e.pointerId);
        const startX = e.clientX, startY = e.clientY;
        const w0 = this.el.offsetWidth;
        const ar = this.aspect();
        const maxW = grid.clientWidth - 12;
        this.el.classList.add("resizing");
        const onMove = ev => {
          // Alt kenardaki dikey sürükleme, görüntü yüksekliğindeki değişimin genişlik karşılığına çevrilir.
          const dx = ev.clientX - startX, dy = (ev.clientY - startY) * ar;
          const d = dir === "e" ? dx : dir === "s" ? dy : (Math.abs(dx) > Math.abs(dy) ? dx : dy);
          tileSizes[this.device.id] = { w: Math.round(Math.max(Tile.MIN_W, Math.min(maxW, w0 + d))) };
          this.applySize();
        };
        const onUp = () => {
          h.removeEventListener("pointermove", onMove);
          h.removeEventListener("pointerup", onUp);
          h.removeEventListener("pointercancel", onUp);
          this.el.classList.remove("resizing");
          saveTileSizes();
        };
        h.addEventListener("pointermove", onMove);
        h.addEventListener("pointerup", onUp);
        h.addEventListener("pointercancel", onUp);
      });
      this.el.appendChild(h);
    });
    this.applySize();
  }

  /** Kutucuğun kendi genişliği (yoksa ortak boyut — CSS --tile-min) ve görüntünün en-boy oranı (--ar). */
  applySize() {
    const size = tileSizes[this.device.id];
    const s = this.el.style;
    if (size && size.w) s.setProperty("--w", size.w + "px"); else s.removeProperty("--w");
    const res = tileRes[this.device.id];
    if (res) s.setProperty("--ar", res[0] + " / " + res[1]); else s.removeProperty("--ar");
  }

  /** Görüntünün en-boy oranı (genişlik / yükseklik): cihazın bilinen çözünürlüğü, yoksa 16:9. */
  aspect() {
    const res = tileRes[this.device.id];
    return res ? res[0] / res[1] : 16 / 9;
  }

  /**
   * Cihazın ekran çözünürlüğü (VNC çerçeve boyutu — bağlanınca ve cihazda değişince): kutucuk oranı
   * buna uyar, cihaz kapalıyken de son bilinen oran kullanılsın diye bu tarayıcıda saklanır; üst sayfaya
   * bildirilir (slider'ın yanındaki % değeri — bkz. Devices "tm-res").
   */
  setResolution(w, h) {
    if (!(w > 0 && h > 0)) return;
    const old = tileRes[this.device.id];
    if (!old || old[0] !== w || old[1] !== h) {
      tileRes[this.device.id] = [w, h];
      try { localStorage.setItem(TILE_RES_KEY, JSON.stringify(tileRes)); } catch (e) { /* kalıcılık önemsiz */ }
      if (embed) this.applySize();
    }
    if (embed) window.parent.postMessage({ type: "tm-res", id: this.device.id, w, h }, location.origin);
  }

  /**
   * "Kapanıyor…" yazan cihaz kapandı (üst sayfa tm-devices closed {id: an}, bkz. Devices.js __closedNotes):
   * CLOSED_NOTE_MS boyunca ortada ve sol altta "Kapandı" (kullanıcı isteği 2026-11-13). Sonra kutucuk listede
   * değilse kalkar (bkz. setDevices leaving), listedeyse olağan "Cihaz kapalı" görünümüne döner.
   * @return {Boolean} bu kapanış ilk kez mi işlendi
   */
  showClosed(at) {
    if (this.closedAt === at) return false;
    this.closedAt = at;
    this.closedUntil = Date.now() + CLOSED_NOTE_MS;
    clearTimeout(this.closedTimer);
    this.closedTimer = setTimeout(() => {
      this.closedUntil = 0;
      this.el.classList.remove("closed");
      if (!this.el._leaving) this.setDevice(this.device);
    }, CLOSED_NOTE_MS);
    this.paintClosed();
    return true;
  }

  paintClosed() {
    this.el.classList.add("offline", "closed");
    this.wanted = false;
    this.disconnect();
    this.setState("offline", "Kapandı");
    this.whoamiEl.classList.remove("querying", "error");
    this.whoamiEl.textContent = "Kapandı";
    this.whoamiEl.hidden = false;
  }

  /** Ad/durum güncellemesi (gömülü kipte üst sayfadan gelen liste). */
  setDevice(device) {
    this.device = device;
    this.el._deviceId = device.id;
    this.el.querySelector(".name").textContent = device.name || ("#" + device.id);
    this.setWhoami(device.whoami);
    this.setStats(device.stats);
    this.el.classList.toggle("powersave", !!device.powersave);
    this.tickShutdown();
    this.refreshWanted();
    if ((device.refresh || 0) !== this.refreshNonce) {
      this.refreshNonce = device.refresh || 0;
      this.refreshStream();
    }
    if (this.closedUntil > Date.now()) this.paintClosed();
  }

  /**
   * Üst sayfa ekranın değiştiğini biliyor (Ekran ▸ Kilitle / Kilidi aç teyit edildi): akış yeniden kurulur, yeni
   * görüntü gelince "tm-refreshed" bildirilir. Bağlı değilse beklenecek akış yok: hemen bildirilir.
   */
  refreshStream() {
    if (!this.rfb || !this.el.classList.contains("live")) {
      window.parent.postMessage({ type: "tm-refreshed", id: this.device.id }, location.origin);
      return;
    }
    this.refreshPending = true;
    this.reconnect();
  }

  /**
   * Güç tasarrufu yazısının altında TiHA'nın geri sayımlı otomatik kapatmasına kalan süre (saniyede bir —
   * bkz. aşağıdaki setInterval). `device.autoshutdown` (üst sayfadan, ~30 sn'lik yoklamadan): {phase, kind,
   * countdown, dialog_at, off_at} (epoch ms) ya da null (uygulanmıyor). Servis dakikada bir denetlediğinden
   * ±1 dk sapabilir; "10 dakika ertele" dışarıdan görünmez (sonraki yoklamada düzelir).
   */
  tickShutdown() {
    const sd = this.device.autoshutdown;
    let text = "";
    if (sd) {
      const left = at => Math.max(0, Math.round((at - Date.now()) / 1000));
      const fmt = s => s >= 3600 ? `${Math.floor(s / 3600)} sa ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")} dk`
        : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      if (sd.phase === "countdown" && sd.off_at) {
        text = `Kapatma penceresi açık — ${fmt(left(sd.off_at))} sonra kapanacak`;
      } else if (sd.dialog_at) {
        const s = left(sd.dialog_at);
        const what = sd.kind === "clock" ? "Saatli otomatik kapatma" : "Otomatik kapatma";
        text = s > 0 ? `${what} uyarısına ${fmt(s)}` : `${what} uyarısı her an açılabilir`;
      }
    }
    if (this.sdEl.textContent !== text) this.sdEl.textContent = text;
  }

  /**
   * Alt bar: `stats` {cpu, mem, temp, disk_temp, fan, battery} (yüzde/°C/RPM/V, her biri null
   * olabilir — fan/pil cihazda Super I/O sürücüsü yüklüyse gelir) ya da null (kapalı cihaz /
   * son 5 dakikada ölçüm yok — bkz. backend MetricsApi::latest). Yalnız gömülü kipte görünür (CSS).
   */
  setStats(stats) {
    // device.hide: bu kullanıcının bu cihazda gizlediği göstergeler (cpu, temp, mem, disk_temp, fan, battery, net —
    // alt bara sağ tıkla seçilir, sunucuda kullanıcı tercihi; bkz. Devices.__openStatsMenu).
    const hide = new Set(this.device.hide || []);
    const net = this.device.online === false || hide.has("net") ? null : this.device.net;
    const key = JSON.stringify([stats || null, net || null, [...hide]]);
    if (key === this.statsKey) return;
    this.statsKey = key;
    this.statsEl.textContent = "";
    this.netIcons(net);
    if (!stats) {
      this.statsEl.insertAdjacentHTML("beforeend", `<span class="none">${this.device.online === false ? "Cihaz kapalı" : "Ölçüm yok"}</span>`);
      return;
    }
    // Eşikler: warn/crit değerin üstünde ise renklenir; pilde ters (alt eşik) — CR2032 ~3 V, 2.5 V altı biter.
    const val = (value, text, warn, crit, low) => {
      if (value === null || value === undefined) return `<span class="none">—</span>`;
      const bad = low ? v => v <= crit : v => v >= crit, mid = low ? v => v <= warn : v => v >= warn;
      return `<span class="${bad(value) ? "crit" : mid(value) ? "warn" : ""}">${text}</span>`;
    };
    // Gizlenen parçalar atlanır; bir göstergenin bütün parçaları gizliyse o gösterge hiç yazılmaz.
    const item = (label, ...parts) => (parts = parts.filter(Boolean)).length
      ? `<span><span class="k">${label}</span>${parts.join(" - ")}</span>` : "";
    const show = (k, html) => hide.has(k) ? "" : html;
    const temp = v => Math.round(v) + " °C";
    this.statsEl.insertAdjacentHTML("beforeend",
      item("CPU:", show("cpu", val(stats.cpu, "%" + Math.round(stats.cpu), 70, 90)),
        show("temp", val(stats.temp, temp(stats.temp ?? 0), 70, 85))) +
      item("RAM:", show("mem", val(stats.mem, "%" + Math.round(stats.mem), 80, 92))) +
      item("HDD:", show("disk_temp", val(stats.disk_temp, temp(stats.disk_temp ?? 0), 50, 60))) +
      item("Fan:", show("fan", val(stats.fan, Math.round(stats.fan ?? 0) + " RPM", Infinity, Infinity))) +
      item("Pil:", show("battery", val(stats.battery, (stats.battery ?? 0).toFixed(2) + " V", 2.8, 2.5, true))));
  }

  /**
   * Alt barın soluna ağ arabirimi simgeleri: `net` {wifi_radio, ifaces: [{name, kind, up, …}]} (üst sayfadan —
   * worker executor/netif.py, ~30 sn'de bir) ya da null. Yeşil = etkin (kablolu: bağlantı var; Wi-Fi: kart açık),
   * gri = değil. Üzerine gelince ipucu (title) kartın özelliklerini ve yapılandırmasını gösterir.
   */
  netIcons(net) {
    if (!net || !((net.ifaces && net.ifaces.length) || (net.usb && net.usb.length))) return;
    const box = document.createElement("span");
    box.className = "net";
    for (const it of net.ifaces || []) {
      const tmp = document.createElement("span");
      tmp.innerHTML = NET_ICON[it.kind] || NET_ICON.other;
      const svg = tmp.firstElementChild;
      svg.classList.toggle("up", !!it.up);
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = netHint(it, net.wifi_radio);
      svg.appendChild(title);
      box.appendChild(svg);
    }
    // Wi-Fi'nin sağında USB bellek (kullanıcı isteği 2026-11-23): yalnız takılı USB disk/flaş bellek varken, yeşil;
    // ipucunda aygıt ve bölüm özellikleri (bkz. worker executor/netif.py "usb").
    if (net.usb && net.usb.length) {
      const tmp = document.createElement("span");
      tmp.innerHTML = USB_ICON;
      const svg = tmp.firstElementChild;
      svg.classList.add("up", "usb");
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = usbHint(net.usb);
      svg.appendChild(title);
      box.appendChild(svg);
    }
    this.statsEl.appendChild(box);
  }

  /**
   * "Oturumları sorgula" ve "Oturum aç"/"Oturumu kapat" (bkz. Devices.js __sessionJob)
   * sonucunu sol altta gösterir — yalnız önizlemede (q=thumb); tam ekran/tek cihaz görünümünde
   * (q=view) zaten canlı ekranın kendisi yeterli, rozet gereksiz. `whoami`: null (hiç sorgulanmadı,
   * gizli), {status:"querying", text?}, ya da {status:"ok"|"error", text}.
   */

  /**
   * Hoparlör düğmesi (varsayılan kapalı): cihazın çıkış sesi bu tarayıcıda çalar. Ham PCM (24 kHz, stereo, s16le — bkz.
   * worker screen/audio.py) parça parça zamanlanır; ağ gecikmesi birikirse atlanarak canlıya dönülür. Cihazın sesi kesilmez.
   */
  setAudio(on, note) {
    const btn = this.el.querySelector("button.snd");
    const ws = this.audioWs;
    this.audioWs = null;
    if (ws) { ws.onclose = null; ws.close(); }
    if (!on) {
      if (this.audioCtx) { this.audioCtx.close(); this.audioCtx = null; }
      if (btn) { btn.innerHTML = SPEAKER_OFF; btn.title = note || "Cihazın sesini bu bilgisayara aktar (kapalı)"; btn.classList.remove("on"); btn.classList.toggle("err", !!note); }
      return;
    }
    const ctx = this.audioCtx || (this.audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 }));
    ctx.resume();
    if (btn) { btn.innerHTML = SPEAKER_ON; btn.title = "Cihazın sesi aktarılıyor (kapatmak için tıklayın)"; btn.classList.add("on"); btn.classList.remove("err"); }
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const sock = this.audioWs = new WebSocket(`${proto}//${location.host}/screen/ws/audio/${this.device.id}`);
    sock.binaryType = "arraybuffer";
    let next = 0;
    let rest = null;      // çerçeve sınırına denk gelmeyen artık baytlar
    sock.onmessage = e => {
      let bytes = new Uint8Array(e.data);
      if (rest) {
        const joined = new Uint8Array(rest.length + bytes.length);
        joined.set(rest);
        joined.set(bytes, rest.length);
        bytes = joined;
        rest = null;
      }
      const usable = bytes.length - bytes.length % 4;
      if (usable < bytes.length) rest = bytes.slice(usable);
      if (!usable) return;
      const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, usable / 2);
      const frames = pcm.length / 2;
      const buf = ctx.createBuffer(2, frames, 24000);
      const l = buf.getChannelData(0), r = buf.getChannelData(1);
      for (let i = 0; i < frames; i++) { l[i] = pcm[2 * i] / 32768; r[i] = pcm[2 * i + 1] / 32768; }
      const now = ctx.currentTime;
      if (next < now || next > now + 0.8) next = now + 0.12;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(next);
      next += frames / 24000;
    };
    sock.onclose = e => {
      this.audioWs = null;
      const why = { 4008: "Cihazda ses sunucusu yok (oturum yok ya da ses kapalı).", 4002: "Cihaza ulaşılamadı.", 4003: "SSH girişi reddedildi." };
      this.setAudio(false, why[e.code] || "Ses aktarımı kesildi.");
    };
  }

  setWhoami(whoami) {
    if (this.closedUntil > Date.now()) return;   // "Kapandı" süresince (bkz. showClosed)
    if (!whoami || spec.q !== "thumb") {
      this.whoamiEl.hidden = true;
      return;
    }
    this.whoamiEl.classList.toggle("querying", whoami.status === "querying");
    this.whoamiEl.classList.toggle("error", whoami.status === "error");
    // "querying": sürmekte olan iş — metni üst sayfa verir ("ali oturumu açılıyor…", "Oturum sorgulanıyor…").
    this.whoamiEl.textContent = whoami.status === "querying"
      ? (whoami.text || "Oturum sorgulanıyor…") : (whoami.text || "Oturumu açık kullanıcı yok" + this.noSessionFor());
    this.whoamiEl.hidden = false;
  }

  /**
   * " (23 dk)" / " (1 sa 12 dk)": cihazın ne zamandır oturumsuz açık olduğu (kullanıcı isteği). Başlangıç
   * üst sayfadan gelir (device.noSessionSince, epoch sn — DevicesApi no_session_since: oturumsuz kalınan
   * açık aralığın başı ya da son oturumun bitişi); bilinmiyorsa boş. Dakikada bir tazelenir (bkz. tickWhoami).
   */
  noSessionFor() {
    const since = this.device.noSessionSince;
    if (!since) return "";
    const min = Math.max(0, Math.floor((Date.now() / 1000 - since) / 60));
    const h = Math.floor(min / 60), m = min % 60;
    return " (" + (h ? `${h} sa ${m} dk` : `${m} dk`) + ")";
  }

  /** Bağlı kalmalı mı: sekme görünür, kutucuk görünür alanda ve cihaz çevrimiçi (kapalı cihaza SSH denenmez). */
  refreshWanted() {
    const offline = this.device.online === false;
    this.el.classList.toggle("offline", offline);
    if (offline) {
      this.wanted = false;
      this.disconnect();
      this.syncPerf();
      // Ağda canlı ama SSH yanıt vermiyor (Akıllı Tahtalar ▸ Yönetilebilir: Hayır): kapalı DEĞİL, yönetilemiyor.
      // "Kapandı" süresinde (bkz. showClosed) görünür alan değişimi vb. ile çağrılınca yazı ezilmesin.
      this.setState("offline", this.closedUntil > Date.now() ? "Kapandı"
        : this.device.alive ? "Cihaz açık — yönetilemiyor (SSH yanıt vermiyor)" : "Cihaz kapalı");
      return;
    }
    // Ekranı ayrı pencerede açık (bkz. "tm-popped"): aynı cihaza ikinci akış açılmaz; pencere kapanınca döner.
    const wasPopped = this.el.classList.contains("popped");
    const isPopped = popped.has(this.device.id);
    this.el.classList.toggle("popped", isPopped);
    if (isPopped) {
      this.setWanted(false);
      this.disconnect();   // donmuş son görüntü de kalkar: yerine not
      this.setState("popped", "Ayrı pencerede izleniyor");
      return;
    }
    if (wasPopped && !this.frozen) this.setState("connecting", "Bağlanıyor…");
    this.setWanted(!document.hidden && !paused && this.inView);
  }

  setState(state, text) {
    this.el.classList.toggle("live", state === "live");
    this.el.classList.toggle("error", state === "error");
    if (text !== undefined) this.msg.innerHTML = text;
  }

  /**
   * @param prev {Map?} {rfb, wrap} — kesintisiz geçiş (bkz. reconnect): yeni bağlantı kurulup ilk
   *   görüntüsü gelene dek eski akış ekranda (yeni katmanın ÜSTÜNDE) kalır, sonra kaldırılır.
   */
  connect(prev) {
    clearTimeout(this.timer);
    // Duraklatılmışken donan son görüntü (bkz. freeze), yeni akışın ilk karesi gelene dek ekranda kalır.
    if (!prev && this.frozen) {
      prev = this.frozen;
      this.frozen = null;
    }
    if (this.rfb || !this.wanted) {
      if (prev) Tile.dropLayer(prev);
      return;
    }
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    // fresh=1: ekran değişti (bkz. refreshStream) — salt izleme paylaşılan yayındır (bkz. worker screen/shared_feed.py),
    // var olana katılmak yerine yenisi kurulur.
    const ws = new WebSocket(`${proto}//${location.host}/screen/ws/${this.device.id}?q=${this.q}${this.control ? "&control=1" : ""}${embed ? "&nolog=1" : ""}${this.refreshPending ? "&fresh=1" : ""}`);
    const token = this.token = {};                  // eski bağlantının geç gelen "close"u yenisini bozmasın
    // Her bağlantı kendi katmanında: yeni katman en alta eklenir, böylece geçişte eski görüntü
    // üstte kalır (.msg/.whoami katmanları da hep üstte).
    const wrap = document.createElement("div");
    wrap.className = "screen";
    this.view.insertBefore(wrap, this.view.firstChild);
    ws.addEventListener("close", e => {
      if (this.token !== token) return;
      if (prev) { Tile.dropLayer(prev); prev = null; }
      this.onClose(e.code, e.reason);
    });
    const p = PROFILE[this.q];
    const rfb = new RFB(wrap, ws, { shared: true });
    rfb.viewOnly = !this.control;
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.focusOnClick = this.control;   // müdahalede ekrana tıklayınca klavye de cihaza gider
    rfb.qualityLevel = p.quality;
    rfb.compressionLevel = p.compression;
    rfb.background = "#000";
    const fresh = !prev;                // kalite değişimi (kesintisiz geçiş) yeni bağlantı sayılmaz
    // Ekranın gerçek çözünürlüğü VNC masaüstü adında gelir ("ankamon-1920x1080" — bkz. worker/ankamon/
    // screen/remote.py; önizleme akışı cihazda küçültüldüğünden çerçeve boyutu gerçek boyut değildir).
    // Ad yoksa (eski x11vnc) oran için çerçeve boyutu kullanılır: bağlantıda (ServerInit) ve cihazda
    // çözünürlük değişince (DesktopSize) gelir; noVNC bunu olay olarak yaymıyor, iç _resize sarılır.
    let native = false;
    rfb.addEventListener("desktopname", e => {
      const m = /^ankamon-(\d+)x(\d+)$/.exec((e.detail && e.detail.name) || "");
      if (m && this.token === token) {
        native = true;
        this.setResolution(+m[1], +m[2]);
      }
    });
    const resize = rfb._resize.bind(rfb);
    rfb._resize = (w, h) => {
      resize(w, h);
      if (!native && this.token === token) this.setResolution(w, h);
    };
    rfb.addEventListener("connect", () => {
      this.setState("live");
      if (this.control) rfb.focus();
      // "Bağlanıyor…" bitti: ana sayfa bu cihazın oturumunu sorgulasın (bkz. Devices.__onMessage "tm-live").
      if (fresh) window.parent.postMessage({ type: "tm-live", id: this.device.id }, location.origin);
      if (prev) {
        // "connect" ilk kareden hemen önce gelir; yeni akış ilk görüntüsünü çizene dek eskisi kalsın.
        const old = prev;
        prev = null;
        setTimeout(() => {
          Tile.dropLayer(old);
          if (this.refreshPending) {
            this.refreshPending = false;
            window.parent.postMessage({ type: "tm-refreshed", id: this.device.id }, location.origin);
          }
        }, Tile.SWAP_MS);
      }
    });
    this.rfb = rfb;
    this.wrap = wrap;
    if (!prev) this.setState("connecting", "Bağlanıyor…");
    // El sıkışma bir yerde takılırsa (ör. cihaz yeni açılmış, X/x11vnc hazır değil) "Bağlanıyor…"da
    // süresiz kalmasın: süre dolunca bu akış bırakılır ve olağan yeniden deneme yoluna girilir.
    this.timer = setTimeout(() => {
      if (this.token !== token || this.el.classList.contains("live")) return;
      this.token = null;
      Tile.dropLayer({ rfb, wrap });
      if (prev) Tile.dropLayer(prev);
      this.onClose(4900, "");
    }, Tile.CONNECT_TIMEOUT_MS);
  }

  /**
   * Görüntü tümüyle siyah mı: tuval küçük bir örnek tuvale indirgenip piksellere bakılır (ucuz; 2 sn'de
   * bir — bkz. aşağıdaki setInterval). Arka arkaya iki ölçüm siyahsa "blank" sınıfı verilir (geçişte
   * anlık siyah kare yanlış uyarı vermesin); yalnız bağlı (live) kutucukta anlamlı.
   */
  checkBlank() {
    if (this.frozen && !this.wrap) return;   // duraklatılmış: son durum kalır
    let blank = false;
    const c = this.el.classList.contains("live") && this.wrap && this.wrap.querySelector("canvas");
    if (c && c.width && c.height) {
      if (!Tile.probe) {
        const pc = Object.assign(document.createElement("canvas"), { width: 48, height: 27 });
        Tile.probe = pc.getContext("2d", { willReadFrequently: true });
      }
      Tile.probe.drawImage(c, 0, 0, 48, 27);
      const d = Tile.probe.getImageData(0, 0, 48, 27).data;
      blank = true;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] > 12 || d[i + 1] > 12 || d[i + 2] > 12) { blank = false; break; }
      }
    }
    this.blankHits = blank ? (this.blankHits || 0) + 1 : 0;
    this.el.classList.toggle("blank", this.blankHits >= 2);
  }

  disconnect() {
    clearTimeout(this.timer);
    this.token = null;
    const layer = { rfb: this.rfb, wrap: this.wrap };
    this.rfb = null;
    this.wrap = null;
    Tile.dropLayer(layer);
    if (this.frozen) {
      Tile.dropLayer(this.frozen);
      this.frozen = null;
    }
  }

  /**
   * Akışı keser ama son görüntüyü ekranda bırakır (sekme/sayfa gizli, kutucuk görünür alanın dışında):
   * kutucuk yeniden çizilmez, "Bağlanıyor…"a dönmez. Yeniden bağlanınca yeni akışın ilk karesi gelene dek
   * bu görüntü kalır (bkz. connect). Bağlı değilse (hata/bağlanıyor) olağan disconnect.
   */
  freeze() {
    if (!this.rfb || !this.el.classList.contains("live")) {
      this.disconnect();
      return;
    }
    clearTimeout(this.timer);
    this.token = null;   // kapanan akışın "close"u kutucuğu hata durumuna sokmasın
    if (this.frozen) Tile.dropLayer(this.frozen);
    // noVNC disconnect'te kendi tuvalini kaldırır: son kare önce kopyalanır, katmanda o kalır.
    const src = this.wrap.querySelector("canvas");
    let shot = null;
    if (src && src.width && src.height) {
      shot = document.createElement("canvas");
      shot.width = src.width;
      shot.height = src.height;
      shot.className = "frozen";
      try { shot.getContext("2d").drawImage(src, 0, 0); } catch (e) { shot = null; }
    }
    try { this.rfb.disconnect(); } catch (e) { /* zaten kapalı */ }
    if (shot) this.wrap.appendChild(shot);
    this.frozen = { rfb: null, wrap: this.wrap };
    this.rfb = null;
    this.wrap = null;
  }

  /**
   * Siyah ekran / "Bağlanıyor…" göstermeden yeni bir akışa geçer (müdahale kipi aç/kapa, kalite
   * değişimi). Cihazdaki x11vnc salt izleme (-viewonly) ya da girdi kabul eden kipte başlatıldığından
   * (güvenlik cihaz tarafında, bkz. worker/ankamon/screen/remote.py) kip değişimi yeni bir bağlantı
   * gerektirir — ama o kurulurken eski görüntü canlı kalır.
   */
  reconnect() {
    clearTimeout(this.timer);
    const prev = this.rfb ? { rfb: this.rfb, wrap: this.wrap } : null;
    this.rfb = null;
    this.wrap = null;
    this.token = null;   // eski akışın "close"u artık yeni bağlantıyı etkilemesin
    this.connect(prev);
  }

  static dropLayer(layer) {
    if (layer.rfb) { try { layer.rfb.disconnect(); } catch (e) { /* zaten kapalı */ } }
    if (layer.wrap) layer.wrap.remove();
  }

  onClose(code, reason) {
    this.rfb = null;
    this.token = null;
    if (this.wrap) { this.wrap.remove(); this.wrap = null; }   // ölü akışın katmanı birikmesin
    if (code === 4030) this.setControl(false, true);   // yetki yok: salt izlemeye dön (yeniden bağlanmadan)
    if (!this.wanted) return;                       // bilerek kapatıldı (görünmüyor / sekme gizli)
    if (code === 4010) { this.connect(); return; }  // paylaşılan yayın bitti/tazelendi: yenisine hemen bağlan
    if (code === 4006) {
      // x11vnc arka planda kuruluyor: hata değil — kısa aralıkla yeniden bağlanılır, kurulum bitince açılır.
      this.setState("connecting", MESSAGES[4006]);
      this.timer = setTimeout(() => this.connect(), Tile.INSTALL_POLL_MS);
      return;
    }
    if (code === 4007) {
      // Son kurulum başarısız: köprü bir süre yeniden kurmaz; seyrek denenir (ağ/depo düzelince kurar).
      const job = /job (\d+)/.exec(reason || "");
      this.setState("error", MESSAGES[4007] + (job ? ` (görev #${job[1]})` : ""));
      this.timer = setTimeout(() => this.connect(), Tile.INSTALL_FAILED_RETRY_MS);
      return;
    }
    let text = MESSAGES[code] || "Bağlantı kesildi. Yeniden deneniyor…";
    if (code === 4005 && reason) text += ": " + reason.replace(/[<>&]/g, "");
    if (code === 1006 && !this.el.classList.contains("live")) text = "Bağlantı kurulamadı (yetki ya da sunucu). Yeniden deneniyor…";
    this.setState("error", text + (FINAL.has(code) ? ' <br><a href="#" data-retry>Yeniden dene</a>' : ""));
    const retry = this.msg.querySelector("[data-retry]");
    if (retry) retry.addEventListener("click", ev => { ev.preventDefault(); this.connect(); });
    if (!FINAL.has(code)) this.timer = setTimeout(() => this.connect(), PROFILE[this.q].retry);
  }

  setWanted(wanted) {
    if (wanted === this.wanted) return;
    this.wanted = wanted;
    // "Ekranı yönet" (sağ menü — bkz. ui/DeviceOps.screen manage): ilk bağlantı doğrudan müdahale kipinde.
    if (spec.manage && spec.control) this.setControl(true, true);
    wanted ? this.connect() : this.freeze();
    this.syncPerf();
  }

  /**
   * "Başarım" görünümü: yalnız görünüm açıkken VE kutucuk bağlı kalmalıyken (sekme açık, görünür
   * alanda, cihaz çevrimiçi — bkz. refreshWanted) cihaz başına tek bir WebSocket; kopunca 5 sn sonra
   * yeniden denenir. Kapanınca akış ve cihazdaki döngü biter (bkz. worker/ankamon/screen/perf.py).
   */
  syncPerf() {
    const want = view.perf && this.wanted;
    this.perfEl.hidden = !want;
    if (!want) {
      this.perfStop();
      return;
    }
    if (this.perfWs || this.perfTimer) return;
    if (!this.perfIn.firstChild) this.perfIn.innerHTML = '<div class="wait">Başarım verisi bekleniyor…</div>';
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = this.perfWs = new WebSocket(`${proto}//${location.host}/screen/ws/perf/${this.device.id}`);
    ws.addEventListener("message", e => this.renderPerf(JSON.parse(e.data)));
    ws.addEventListener("close", () => {
      if (this.perfWs !== ws) return;           // bilerek kapatıldı (perfStop)
      this.perfWs = null;
      this.perfTimer = setTimeout(() => { this.perfTimer = null; this.syncPerf(); }, 5000);
    });
  }

  perfStop() {
    clearTimeout(this.perfTimer);
    this.perfTimer = null;
    const ws = this.perfWs;
    this.perfWs = null;
    if (ws) ws.close();
    this.perfIn.innerHTML = "";
  }

  /** htop'un üst panelleri (bkz. perf.py mesajı); sayılar KiB, yüzde ve saniye. */
  renderPerf(p) {
    const esc = s => String(s).replace(/[<>&"]/g, "");
    const size = kib => kib >= 1048576 ? (kib / 1048576).toFixed(2) + "G" : Math.round(kib / 1024) + "M";
    const seg = (cls, pct) => pct > 0 ? `<i class="${cls}" style="width:${Math.min(100, pct)}%"></i>` : "";
    const row = (lbl, bar, v) => `<div class="row"><span class="lbl">${lbl}</span><span class="bar">${bar}</span><span class="v">${v}</span></div>`;
    const cpus = p.cpus.map((c, i) => {
      const busy = c[0] + c[1] + c[2] + c[3];
      return row(i + 1, seg("u", c[0]) + seg("n", c[1]) + seg("s", c[2]) + seg("o", c[3]),
        `<span class="${busy >= 90 ? "hi" : ""}">${busy.toFixed(1)}%</span>`);
    }).join("");
    const m = p.mem, mt = m.total || 1, st = p.swap.total || 1;
    const mem = row("Mem", seg("u", 100 * m.used / mt) + seg("n", 100 * m.buffers / mt) + seg("c", 100 * m.cache / mt),
      `${size(m.used)}/${size(m.total)}`);
    const swp = row("Swp", seg("s", 100 * p.swap.used / st), `${size(p.swap.used)}/${size(p.swap.total)}`);
    const up = p.uptime, d = Math.floor(up / 86400);
    const hms = [Math.floor(up % 86400 / 3600), Math.floor(up % 3600 / 60), up % 60].map(n => String(n).padStart(2, "0")).join(":");
    const right =
      `<div class="row"><span class="k">Görevler:</span> ${esc(p.tasks)}, ${esc(p.threads)} thr</div>` +
      `<div class="row"><span class="k">Çalışan:</span> ${esc(p.running)}</div>` +
      `<div class="row"><span class="k">Yük ort.:</span> ${p.load.map(v => Number(v).toFixed(2)).join(" ")}</div>` +
      `<div class="row"><span class="k">Çalışma:</span> ${d ? d + " gün, " : ""}${hms}</div>`;
    const hw = this.device.hw ? `<div class="hw" title="${esc(this.device.hw)}">${esc(this.device.hw)}</div>` : "";
    this.perfIn.style.setProperty("--rows", Math.max(p.cpus.length + 2, 4) + (hw ? 2 : 0));
    this.perfIn.innerHTML = `${hw}<div class="l">${cpus}${mem}${swp}</div><div class="r">${right}</div>`;
  }

  /**
   * Müdahale kipini açar/kapatır: cihazdaki x11vnc girdi kabul eden kipte yeniden başlatılır.
   * Onay istemez (kullanıcı isteğiyle kaldırıldı) — yetki zaten "screen.control" özelliğiyle
   * denetleniyor (bkz. Kullanıcılar sayfası); oturum açılışı yine de command/etkinlik loguna yazılır.
   */
  setControl(on, noReconnect) {
    this.control = on;
    // Yalnız düğme kırmızı olur (kullanıcı isteğiyle); kutucukta ekstra çerçeve/rozet yok.
    const ctl = this.el.querySelector("button.ctl");
    if (ctl) ctl.classList.toggle("on", on);
    this.el.classList.toggle("control", on); // görünüm değişmez; yalnız imleç kuralı (bkz. CSS)
    if (on) this.q = "view";
    if (!noReconnect) this.reconnect();
  }

  /**
   * Ekran güç tasarrufundaysa (DPMS — üst sayfanın "powersave"i) uyandırma ister: üst sayfa sağ menüdeki
   * Ekran ▸ Uyandır ile aynı işi çalıştırır (bkz. Devices.js "tm-wake"). Art arda basışlar WAKE_MS içinde
   * bir kez gönderilir (iş sürerken "Ekran uyandırılıyor…" yazar; DPMS durumu sonraki yoklamada kalkar).
   */
  wake() {
    if (!this.el.classList.contains("powersave") || Date.now() - (this.wakeAt || 0) < Tile.WAKE_MS) return;
    this.wakeAt = Date.now();
    window.parent.postMessage({ type: "tm-wake", id: this.device.id }, location.origin);
  }

  /** Akış kalitesi: müdahale ve tam ekran en akıcı kipte, sohbet açıkken yazı okunacak kipte, yoksa kutucuğun kendi kalitesinde. */
  applyQuality() {
    const q = this.control || this.isFs ? "view" : chatting.has(this.device.id) ? "chat" : this.base;
    if (q === this.q) return;
    this.q = q;
    this.reconnect();
  }

  /** Kilit düğmelerinin görünümü; fare kilidi dokunmatiği de tuttuğundan düğme ikisini birlikte gösterir. */
  showLocks() {
    this.el.querySelectorAll("button.lk").forEach(btn => {
      const mouse = btn.dataset.device === "mouse";
      const on = mouse ? this.locks.includes("mouse") || this.locks.includes("touch") : this.locks.includes("keyboard");
      const name = mouse ? "Fare ve dokunmatik" : "Klavye";
      btn.classList.toggle("on", on);
      btn.title = on ? `${name} kilitli (açmak için tıklayın)` : `${name} kilidi kapalı (kilitlemek için tıklayın)`;
    });
  }

  /** İşi üst sayfa yürütür (bkz. DeviceOps.__toggleInputLock); sonuç "tm-locks" ile gelir. */
  toggleLock(btn) {
    if (btn.classList.contains("busy")) return;
    btn.classList.add("busy");
    window.parent.postMessage({ type: "tm-inputlock", id: this.device.id, device: btn.dataset.device, lock: !btn.classList.contains("on"),
      locks: this.locks }, location.origin);
  }

  /** done: bu düğmenin işi bitti. Cihaz listesi tazelemesi iş sürerken düğmeyi serbest bırakmaz. */
  setLocks(locks, done) {
    this.locks = locks;
    if (done) this.el.querySelectorAll("button.lk").forEach(btn => btn.classList.remove("busy"));
    this.showLocks();
  }

  /** Ayrı pencere kapandı: pencerenin son karesi kutucukta kalır, yeni akış onun altında kurulur (bkz. connect). */
  setLastFrame(url) {
    if (this.frozen) Tile.dropLayer(this.frozen);
    const wrap = document.createElement("div");
    wrap.className = "screen";
    const img = document.createElement("img");
    img.className = "frozen";
    img.alt = "";
    img.src = url;
    wrap.appendChild(img);
    this.view.insertBefore(wrap, this.view.firstChild);
    this.frozen = { rfb: null, wrap };
    this.setState("live", "");
  }
}
// Kesintisiz geçişte yeni akış "connect" olduktan sonra eski görüntünün kaldırılmadan önce
// beklediği süre (ilk tam kare genelde bundan önce çizilir).
Tile.SWAP_MS = 700;
// Kutucuğa basarak uyandırmada aynı cihaza yeni iş gönderilmeden geçmesi gereken süre (bkz. Tile.wake).
Tile.WAKE_MS = 15000;
// Köprü x11vnc'yi ~2 sn'de başlatır (ssh ConnectTimeout 8 sn, başlatma en çok 30 sn bekler) — bu
// süre içinde "connect" gelmezse akış takılmış sayılır.
Tile.CONNECT_TIMEOUT_MS = 40000;
// x11vnc otomatik kurulurken (4006) yeniden bağlanma aralığı; kurulum bitince önizleme kendiliğinden açılır.
Tile.INSTALL_POLL_MS = 5000;
// Otomatik kurulum başarısızsa (4007) seyrek deneme — köprü zaten 10 dk boyunca yeniden kurmaz.
Tile.INSTALL_FAILED_RETRY_MS = 60000;
// Kenardan boyutlandırmada en küçük kutucuk genişliği / görüntü yüksekliği (slider'ın alt sınırıyla uyumlu).
Tile.MIN_W = 140;

// Kutucukların kendi boyutları (cihaz id → {w?, h?}, piksel) — bu tarayıcıda kalıcı (bkz. Tile.makeResizable).
const TILE_SIZES_KEY = "ankamon.screens.tileSizes";
let tileSizes = {};
// Cihaz başına son bilinen ekran çözünürlüğü [genişlik, yükseklik] (bkz. Tile.setResolution).
const TILE_RES_KEY = "ankamon.screens.tileRes";
let tileRes = {};
try { tileRes = JSON.parse(localStorage.getItem(TILE_RES_KEY) || "{}") || {}; } catch (e) { tileRes = {}; }
try { tileSizes = JSON.parse(localStorage.getItem(TILE_SIZES_KEY) || "{}") || {}; } catch (e) { tileSizes = {}; }

function saveTileSizes() {
  try { localStorage.setItem(TILE_SIZES_KEY, JSON.stringify(tileSizes)); } catch (e) { /* kalıcılık önemsiz */ }
}

/**
 * Ortak kutucuk boyutu (üst sayfadaki slider, "tm-size"). reset: kullanıcı slider'ı oynattı — kenardan
 * verilmiş tek tek boyutlar silinir, bütün kutucuklar aynı genişlik ve yükseklikte olur. Açılışta gelen
 * değer (reset yok) yalnız ortak boyutu kurar, saklı tek tek boyutlar korunur.
 */
function setTileSize(px, reset) {
  document.documentElement.style.setProperty("--tile-min", px + "px");
  if (reset && Object.keys(tileSizes).length) {
    tileSizes = {};
    saveTileSizes();
    tiles.forEach(t => t.applySize());
  }
}

/**
 * Varsayılan boyut (üst sayfada Boyut yazısına çift tık, ya da hiç boyut seçilmemişse): satıra cols kutucuk sığacak
 * genişlik. Kaydırma çubuğu henüz yoksa da payı düşülür; kutucuklar çoğalıp çubuk çıkınca son kutucuk alta kaymasın.
 */
function fitTileWidth(cols) {
  const style = getComputedStyle(grid);
  const gap = parseFloat(style.columnGap) || 0;
  let width = grid.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  if (grid.scrollHeight <= grid.clientHeight) {
    const probe = document.createElement("div");
    probe.style.cssText = "position:absolute;top:-999px;width:100px;height:50px;overflow:scroll";
    document.body.appendChild(probe);
    width -= probe.offsetWidth - probe.clientWidth;
    probe.remove();
  }
  return Math.floor((width - gap * (cols - 1)) / cols);
}

function toggleFullscreen(el) {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}

const tiles = new Map();   // cihaz id → Tile
// Kapanıp listeden düşen cihazın kutucuğu "Kapandı" yazarak bu kadar daha kalır (bkz. Tile.showClosed, setDevices).
const CLOSED_NOTE_MS = 2000;
const leaving = new Map(); // cihaz id → {t, timer}: tiles'tan çıkmış, süresi dolunca DOM'dan kalkacak kutucuk
let chatting = new Set(spec.chat || []);   // sohbet penceresi açık cihazlar (üst sayfadan "tm-chat")
let popped = new Set();     // ekranı ayrı pencerede açık cihazlar (üst sayfadan "tm-popped")
// Üst sayfada Ekranlar sekmesi bir süredir görünmüyor ("tm-pause"): akışlar durur, kutucuklar ve son
// görüntüler yerinde kalır (sayfa yeniden kurulmaz); sekme görününce kaldığı yerden sürer.
let paused = false;

// Kutucuk seçimi (yalnız gömülü kip — Cihazlar sayfasının Ekranlar sekmesi): Tile.click/contextmenu
// ve aşağıdaki dikdörtgen (fare ile sürükleyerek) seçim bunları kullanır. `selected` DOM sırasıyla
// değil, kimlik kümesiyle tutulur; görünür vurgu setSelected() ile kutucukların kendi sınıfına yansır.
let selected = new Set();
let selectAnchor = null;   // Shift ile aralık seçiminde "diğer uç" (son tıklanan kutucuk)
let pendingCollapse = null; // çoklu seçimdeki kutucuğa düz basıldı: sürüklenmezse bırakınca tek seçime iner

/**
 * Seçimi verilen kimlik kümesine EŞİTLER (öncekini temizler) ve kutucukların vurgusunu günceller.
 * Seçim, Cihazlar grid'inin onay kutularıyla TEK kaynaktır: burada değişen seçim "tm-select" ile üst
 * sayfaya bildirilir (grid işaretleri ona eşitlenir — araç çubuğundaki Sil/Komut çalıştır/Kapat…
 * böylece Ekranlar sekmesinde de seçili kutucuklara uygulanır); üst sayfadan gelen "tm-selection"
 * (Tümünü işaretle, grid'de işaretleme) ise fromParent=true ile, geri bildirilmeden uygulanır.
 */
function setSelected(ids, fromParent = false) {
  const next = new Set(ids);
  const changed = next.size !== selected.size || [...next].some(id => !selected.has(id));
  selected = next;
  tiles.forEach((t, id) => t.el.classList.toggle("selected", selected.has(id)));
  if (embed && changed && !fromParent) {
    window.parent.postMessage({ type: "tm-select", ids: [...selected] }, location.origin);
  }
}

function toggleSelected(id) {
  const next = new Set(selected);
  next.has(id) ? next.delete(id) : next.add(id);
  setSelected(next);
}

/** Kutucukların şu anki GÖRÜNÜR (DOM) sırasındaki kimlikleri — sürükle-bırak sonrası bu sıra değişir. */
function orderedIds() {
  return [...grid.children].filter(el => el.classList.contains("tile")).map(el => el._deviceId);
}

/*
 * Sürükle-bırak sıralama, CANLI yerleşimle (kullanıcı isteği): sürüklenen kutucuk bir başka
 * kutucuğun üzerine gelince DOM'da hemen onun yerine taşınır; aradaki kutucuklar kayar. Kayma FLIP
 * ile canlandırılır (eski konumları ölç → taşı → transform ile eski yerden yenisine kaydır), böylece
 * hangi kutucuğun nereye gittiği izlenebilir. Bırakınca sıra kalıcılaşır (tm-reorder); Esc ile ya da
 * ızgara dışına bırakarak vazgeçilirse ilk sıraya dönülür.
 */
let drag = null; // { tile, startOrder, moved, dropped }
const FLIP_MS = 180;

function dragStart(tile) {
  drag = { tile, startOrder: orderedIds(), dropped: false };
  // Sınıf bir sonraki karede eklenir: aynı karede eklenirse tarayıcının sürükleme görüntüsü (anlık
  // görüntü) de soluk/çerçeveli çıkar.
  requestAnimationFrame(() => drag && drag.tile.el.classList.add("dragging"));
}

/** Kutucukları verilen düzenleme işleminden sonra eski yerlerinden yenilerine kaydırarak canlandırır. */
function flip(mutate) {
  const els = [...grid.children].filter(el => el.classList.contains("tile"));
  const before = new Map(els.map(el => [el, el.getBoundingClientRect()]));
  mutate();
  els.forEach(el => {
    const a = before.get(el), b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el._flipUntil = performance.now() + FLIP_MS;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = `transform ${FLIP_MS}ms ease`;
      el.style.transform = "";
    }));
  });
}

function dragOver(target) {
  const dragged = drag.tile.el;
  // Kendi üzerinde ya da kayması süren bir kutucuğun üzerinde (imleç altından kayıp geçerken ileri
  // geri titremesin diye) yer değiştirilmez.
  if (target.el === dragged || (target.el._flipUntil || 0) > performance.now()) return;
  const els = [...grid.children];
  const from = els.indexOf(dragged), to = els.indexOf(target.el);
  // İleri sürüklerken hedefin ARKASINA, geri sürüklerken ÖNÜNE: hedef kutucuk sürüklenenin eski
  // tarafına geçer (dosya yöneticilerindeki/telefon ana ekranındaki gibi).
  flip(() => grid.insertBefore(dragged, from < to ? target.el.nextSibling : target.el));
}

function dragEnd() {
  if (!drag) return;
  const { tile, startOrder, dropped } = drag;
  drag = null;
  tile.el.classList.remove("dragging");
  const now = orderedIds();
  if (!dropped) {
    // Vazgeçildi (Esc ya da ızgara dışına bırakıldı): ilk sıraya dön.
    if (now.join() !== startOrder.join()) flip(() => startOrder.forEach(id => grid.appendChild(tiles.get(id).el)));
    return;
  }
  if (embed && now.join() !== startOrder.join()) {
    window.parent.postMessage({ type: "tm-reorder", order: now }, location.origin);
  }
}

// Izgaranın herhangi bir yerine (kutucuklar arası boşluk dahil) bırakmak geçerlidir: kutucuk zaten
// sürükleme sırasında yerine taşınmıştır.
grid.addEventListener("dragover", e => {
  if (!drag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
});
grid.addEventListener("drop", e => {
  if (!drag) return;
  e.preventDefault();
  drag.dropped = true;
});

if (embed) {
  // Boş alana basılı tutup sürükleyerek dikdörtgenle çoklu seçim (Explorer'daki "rubber band" gibi);
  // hareketsiz bir tıklama (sürükleme yok) seçimi temizler — Shift/Ctrl basılıyken ekler, değiştirmez.
  grid.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".tile")) return;
    const startX = e.clientX, startY = e.clientY;
    const additive = e.shiftKey || e.ctrlKey || e.metaKey;
    const base = additive ? new Set(selected) : new Set();
    let box = null;
    const update = (cx, cy) => {
      const x0 = Math.min(startX, cx), x1 = Math.max(startX, cx);
      const y0 = Math.min(startY, cy), y1 = Math.max(startY, cy);
      if (!box && (Math.abs(cx - startX) > 3 || Math.abs(cy - startY) > 3)) {
        box = document.createElement("div");
        box.className = "marquee";
        document.body.appendChild(box);
      }
      if (box) {
        box.style.left = x0 + "px"; box.style.top = y0 + "px";
        box.style.width = (x1 - x0) + "px"; box.style.height = (y1 - y0) + "px";
      }
      const hit = [];
      tiles.forEach((t, id) => {
        const r = t.el.getBoundingClientRect();
        if (r.right >= x0 && r.left <= x1 && r.bottom >= y0 && r.top <= y1) hit.push(id);
      });
      setSelected([...base, ...hit]);
    };
    const onMove = ev => update(ev.clientX, ev.clientY);
    const onUp = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      if (box) {
        box.remove();
      } else if (!additive) {
        setSelected([]); // hareketsiz tıklama, boş alan: seçim kalkar
      }
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });

  // Ctrl/⌘+A (kullanıcı isteği): o an gösterilen TÜM kutucukları seçer; zaten hepsi seçiliyse
  // tekrar basınca seçim kalkar (aç/kapa) — grid'in Ctrl+A'sıyla aynı aç/kapa mantığı.
  document.addEventListener("keydown", e => {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "a") return;
    e.preventDefault();
    const allIds = [...tiles.keys()];
    if (!allIds.length) return;
    const allSelected = allIds.every(id => selected.has(id));
    setSelected(allSelected ? [] : allIds);
  });
}

const io = "IntersectionObserver" in window && (embed || spec.devices.length > 1)
  ? new IntersectionObserver(entries => {
      // Gömülü kipte iframe'in kendisi gizlenince (Liste sekmesi) bütün kutucuklar "görünmez" olur;
      // o durumda bağlantılar burada kesilmez — üst sayfa 10 sn sonra "tm-pause" ile duraklatır
      // (sekmeler arasında hızlı gidip gelmede yeniden bağlanma olmasın).
      if (embed && grid.clientWidth === 0) return;
      entries.forEach(e => {
        const t = [...tiles.values()].find(t => t.el === e.target);
        // Tam ekrandaki kutucuk hariç: tarayıcı onu "top layer"a taşıdığından `root: grid`
        // kesişimi bozulup yanlışlıkla isIntersecting=false gelebilir — bu, fullscreenchange'in
        // az önce kurduğu bağlantıyı hemen disconnect() ile koparır ("Bağlanıyor…" mesajı hiç
        // güncellenmeden asılı kalır, bkz. aşağıdaki fullscreenchange). Tam ekrandaki kutucuk
        // tanım gereği zaten görünürdür, IO'nun aksini söylemesi önemsizdir.
        if (t && t.el !== document.fullscreenElement) { t.inView = e.isIntersecting; t.refreshWanted(); }
      });
    }, { root: grid })
  : null;

// Güvence: IO "görünmüyor" dedikten sonra kutucuk görünür olduğu hâlde bir daha tetiklenmezse (yerleşim
// ilk ölçülürken iframe boyutu henüz oturmamışsa olabiliyor) kutucuk bağlanmadan "Bağlanıyor…"da kalırdı.
// Görünmez sayılanlar ara sıra gerçek geometriyle yeniden denetlenir; yalnız kaçırılmış "görünür"
// durumunu düzeltir, gereksiz bağlantı açmaz.
if (io) {
  setInterval(() => {
    if (document.hidden || grid.clientWidth === 0) return;
    const g = grid.getBoundingClientRect();
    tiles.forEach(t => {
      if (t.inView || t.el === document.fullscreenElement) return;
      const r = t.el.getBoundingClientRect();
      if (r.bottom > g.top && r.top < g.bottom && r.right > g.left && r.left < g.right) {
        t.inView = true;
        t.refreshWanted();
      }
    });
  }, 3000);
}

// Ağ arabirimi simgeleri (renk currentColor — CSS .net svg / .up).
const NET_ICON = {
