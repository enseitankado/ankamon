};
// USB flaş bellek simgesi (renk currentColor — takılıyken her zaman yeşil, .up).
const USB_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M8 2h8v6h1.5a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1H8zm2 2v4h1.2V5.5h1.6V8H14V4z"/></svg>';

/** USB simgesinin ipucu: her aygıt (üretici/model, boyut, seri) ve bölümleri (dosya sistemi, etiket, bağlama, dolu/boş). */
function usbHint(list) {
  const gb = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB";
  const lines = [list.length > 1 ? `Takılı USB depolama: ${list.length} aygıt` : "Takılı USB depolama"];
  for (const d of list) {
    lines.push("", `${[d.vendor, d.model].filter(Boolean).join(" ") || "USB disk"} — /dev/${d.name}, ${gb(d.size)}` +
      (d.removable ? " (çıkarılabilir)" : ""));
    if (d.serial) lines.push(`Seri: ${d.serial}`);
    if (!d.parts || !d.parts.length) lines.push("Bölüm/dosya sistemi yok");
    for (const p of d.parts || []) {
      let t = `• ${p.name}: ${p.fs ? p.fs.toUpperCase() : "dosya sistemi yok"}` + (p.label ? ` "${p.label}"` : "") + (p.size ? `, ${gb(p.size)}` : "");
      if (p.mount) t += `\n   bağlı: ${p.mount}` + (p.used != null && p.avail != null ? ` — dolu ${gb(p.used)}, boş ${gb(p.avail)}` : "");
      else t += " (bağlı değil)";
      lines.push(t);
    }
  }
  return lines.join("\n");
}
const NET_KIND = { wifi: "Kablosuz (Wi-Fi)", ethernet: "Kablolu (Ethernet)", other: "Ağ arabirimi" };
const NET_METHOD = { auto: "DHCP (otomatik)", manual: "Elle (sabit IP)", disabled: "IPv4 kapalı", "link-local": "Yalnız yerel ağ", shared: "Paylaşılan (yönlendirici)" };

/** Ağ simgesinin ipucu: tür, durum, bağlantı ve IP yapılandırması, donanım. */
function netHint(it, radio) {
  let state;
  if (it.kind === "wifi") {
    state = radio === false ? "Kapalı (Wi-Fi radyosu kapalı)" : it.state === 20 ? "Kullanılamıyor (kart kapalı/engelli)"
      : it.state === 100 ? "Etkin, bağlı" : it.up ? "Etkin, bir ağa bağlı değil" : "Kapalı";
  } else {
    state = it.up ? "Bağlı" : !it.carrier ? "Bağlı değil (kablo takılı değil)" : "Bağlı değil";
  }
  const lines = [`${NET_KIND[it.kind] || NET_KIND.other} — ${it.name}`, `Durum: ${state}`];
  if (it.ssid) lines.push(`Ağ (SSID): ${it.ssid}` + (it.signal != null ? `, sinyal %${it.signal}` : "") + (it.rate ? `, ${it.rate}` : ""));
  if (it.connection) lines.push(`Bağlantı: ${it.connection}`);
  if (it.method) lines.push(`Yapılandırma: ${NET_METHOD[it.method] || it.method}`);
  if (it.ipv4 && it.ipv4.length) lines.push(`IPv4: ${it.ipv4.join(", ")}`);
  if (it.gateway) lines.push(`Ağ geçidi: ${it.gateway}`);
  if (it.dns && it.dns.length) lines.push(`DNS: ${it.dns.join(", ")}`);
  if (it.ipv6 && it.ipv6.length) lines.push(`IPv6: ${it.ipv6.join(", ")}`);
  if (it.mac) lines.push(`MAC: ${it.mac}`);
  if (it.speed) lines.push(`Hız: ${it.speed >= 1000 ? it.speed / 1000 + " Gb/sn" : it.speed + " Mb/sn"}`);
  if (it.driver) lines.push(`Sürücü: ${it.driver}`);
  return lines.join("\n");
}

// TiHA otomatik kapatma geri sayımı (güç tasarrufu yazısının altında) — bkz. Tile.tickShutdown.
setInterval(() => { if (!document.hidden) tiles.forEach(t => t.tickShutdown()); }, 1000);
// "Oturumu açık kullanıcı yok (N dk)" süresi üst sayfa güncelleme göndermese de ilerlesin.
setInterval(() => { if (!document.hidden) tiles.forEach(t => t.device.whoami && t.setWhoami(t.device.whoami)); }, 30000);

// Siyah (güç tasarrufundaki) ekran algısı — bkz. Tile.checkBlank.
setInterval(() => { if (!document.hidden) tiles.forEach(t => t.checkBlank()); }, 2000);

/**
 * Kutucukları verilen listeye eşitler: yenileri ekler, gidenleri kaldırır, kalanları günceller (yeniden bağlanmadan).
 * @param closed {Object?} {id: an} "Kapanıyor…" yazıp az önce kapanan cihazlar (Devices.js __closedNotes): kutucukta
 *   CLOSED_NOTE_MS "Kapandı"; listeden düşmüşse kutucuk o süre sonunda kalkar (hemen değil).
 */
function setDevices(list, closed = {}) {
  const ids = new Set(list.map(b => b.id));
  for (const [id, t] of tiles) {
    if (!ids.has(id)) {
      tiles.delete(id);
      t.disconnect();
      t.perfStop();
      if (io) io.unobserve(t.el);
      if (closed[id]) t.showClosed(closed[id]);
      const left = (t.closedUntil || 0) - Date.now();
      if (left > 0) {
        t.el._leaving = true;
        t.el.classList.remove("selected");
        leaving.set(id, { t, timer: setTimeout(() => { t.el.remove(); leaving.delete(id); }, left) });
      } else {
        t.el.remove();
      }
    }
  }
  let empty = document.getElementById("empty");
  if (empty && list.length) {
    empty.remove();
    empty = null;
  }
  // Sıra eşitlemesinde kalkmayı bekleyen ("Kapandı") kutucuklar atlanır: yerlerinde durur, ötekileri kaydırmaz.
  const skipLeaving = el => { while (el && el._leaving) el = el.nextElementSibling; return el; };
  let ref = skipLeaving(grid.firstElementChild);
  list.forEach(b => {
    const gone = leaving.get(b.id);
    if (gone) {   // "Kapandı" süresinde listeye geri döndü: bekleyen kutucuk hemen kalkar, yenisi kurulur
      clearTimeout(gone.timer);
      if (ref === gone.t.el) ref = skipLeaving(ref.nextElementSibling);
      gone.t.el.remove();
      leaving.delete(b.id);
    }
    let t = tiles.get(b.id);
    if (!t) {
      t = new Tile(b);
      tiles.set(b.id, t);
      if (io) io.observe(t.el);
    }
    // Sırayı listeyle aynı tut — yalnız yeri gerçekten farklıysa taşınır: her tazelemede bütün
    // kutucukları yeniden eklemek, o an sürüklenen kutucuğun yerel sürüklemesini iptal ediyordu.
    // Sürükleme sürerken sıraya dokunulmaz: canlı yerleşimle değişmiş sıra, üst sayfanın henüz eski
    // sırayı taşıyan tazelemesiyle geri alınmasın (bırakınca tm-reorder ile yeni sıra kaydedilir).
    // Tam ekrandaki kutucuk taşınmaz: DOM'da yer değiştiren öğe tarayıcıda tam ekrandan çıkar (sıra, tam ekran bitince
    // bir sonraki listede düzelir; diğer kutucuklar onun çevresine dizilir).
    if (ref === t.el) ref = skipLeaving(ref.nextElementSibling);
    else if (!drag && t.el !== document.fullscreenElement) grid.insertBefore(t.el, ref);
    else if (ref) ref = skipLeaving(ref.nextElementSibling);
    t.setDevice(b);
    if (closed[b.id]) t.showClosed(closed[b.id]);
  });
  if (!list.length && !empty) {
    empty = document.createElement("div");
    empty.id = "empty";
    empty.textContent = "Gösterilecek cihaz yok.";
    grid.appendChild(empty);
  }
  // Artık gösterilmeyen cihazların seçimi de kalkar (süzgeç değişince "hayalet" seçim kalmasın).
  if ([...selected].some(id => !ids.has(id))) {
    setSelected([...selected].filter(id => ids.has(id)), true); // grid zaten yalnız gösterilenleri tutar
  }
}

document.getElementById("full").addEventListener("click", () => toggleFullscreen(document.documentElement));
document.addEventListener("fullscreenchange", () => {
  const fs = document.fullscreenElement;
  tiles.forEach(t => {
    if (t.el === fs) {
      // IO bu tur içinde henüz güncellenmemiş/yanlış olabilir (yukarıdaki not) — tam ekrana YENİ
      // giren kutucuk için görünürlüğü burada kesin olarak doğru işaretle.
      t.inView = true;
    }
    t.isFs = fs === t.el;
    t.applyQuality();
  });
});
// Yalnız görünen kutucuklar bağlı kalır (onlarca cihazlık önizlemede kaydırılan kutucuklar akış tutmaz).
document.addEventListener("visibilitychange", () => tiles.forEach(t => t.refreshWanted()));

// Gömülü kipte de ayrı pencerede de: açık sohbetler ve kilit durumu üst sayfadan gelir.
window.addEventListener("message", e => {
  if (e.source !== window.parent || e.origin !== location.origin || !e.data) return;
  if (e.data.type === "tm-chat") {
    chatting = new Set(e.data.ids || []);
    tiles.forEach(t => t.applyQuality());
  } else if (e.data.type === "tm-locks" && tiles.has(e.data.id)) {
    tiles.get(e.data.id).setLocks(e.data.locks || [], !!e.data.done);
  }
});

if (embed) {
  // Üst sayfa (Cihazlar) grid'deki cihaz listesini her değiştiğinde gönderir.
  window.addEventListener("message", e => {
    if (e.source !== window.parent || e.origin !== location.origin || !e.data) return;
    if (e.data.type === "tm-devices") { setDevices(e.data.devices || [], e.data.closed || {}); markLoaded(); }
    else if (e.data.type === "tm-selection") setSelected((e.data.ids || []).filter(id => tiles.has(id)), true);
    else if (e.data.type === "tm-size") setTileSize(e.data.px, !!e.data.reset);
    else if (e.data.type === "tm-fit") window.parent.postMessage({ type: "tm-fit", px: fitTileWidth(e.data.cols) }, location.origin);
    else if (e.data.type === "tm-pause") {
      paused = !!e.data.paused;
      tiles.forEach(t => t.refreshWanted());
    }
    else if (e.data.type === "tm-popped") {
      popped = new Set(e.data.ids || []);
      Object.entries(e.data.frames || {}).forEach(([id, url]) => {
        const tile = tiles.get(+id);
        if (tile && !popped.has(+id)) tile.setLastFrame(url);
      });
      tiles.forEach(t => t.refreshWanted());
    }
    else if (e.data.type === "tm-view") {
      view.stats = e.data.stats !== false;
      view.perf = !!e.data.perf;
      document.documentElement.classList.toggle("nostats", !view.stats);
      tiles.forEach(t => t.syncPerf());
    }
  });
  // Kutucuklara tıklayınca üst sayfadaki açık sağ menü kapansın (tıklama iframe'den dışarı çıkmaz).
  document.addEventListener("pointerdown", () =>
    window.parent.postMessage({ type: "tm-click" }, location.origin));
  // Hazırım: üst sayfa güncel listeyi göndersin (yükleme sırasında gelen güncelleme kaybolmasın).
  window.parent.postMessage({ type: "tm-ready" }, location.origin);
}

/** "Yükleniyor…" yazısını kaldırır — ilk cihaz listesi kutucuklara dönüşünce (kullanıcı isteği). */
function markLoaded() {
  document.getElementById("loading")?.remove();
}

// Gömülü kipte liste üst sayfadan ("tm-devices") gelir: o gelene dek boş liste çizilmez (yoksa yükleme
// sırasında yanlışlıkla "Gösterilecek cihaz yok." görünüyordu). Tek pencere kipinde liste adresle gelir.
if (!embed) {
  setDevices(spec.devices);
  markLoaded();
}
</script>
