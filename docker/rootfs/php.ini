expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
; Oturum yükleme ilerlemesi kullanılmıyor; kapalı tutmak, session_start() çağrılmadan da istek
; gövdesinden tetiklenebilen saldırı yüzeyini kaldırır (ör. CVE-2026-109619).
session.upload_progress.enabled = 0
date.timezone = Europe/Istanbul
opcache.enable = 1
opcache.validate_timestamps = 0
