# Ankamon tek konteyner: derlenmiş qooxdoo arayüzü, /api (PHP-FPM) ve /grafana vekili.
# Bütün üst akışlar aynı konteyner içinde (127.0.0.1).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dosya yöneticisi yazmaları (bkz. location = /filemanager/api/resources).
map $request_method $fm_resources_upstream {
    PATCH   127.0.0.1:8894;
    PUT     127.0.0.1:8894;
    default 127.0.0.1:8893;
}
map $request_method $fm_upload {
    POST    1;
    default 0;
}
log_format fm_write "$status\t$arg_source\t$arg_path";

server {
    listen __HTTP_PORT__ default_server;
    # HTTPS (bkz. services/tls.sh — yerel CA ile imzalı sertifika). HTTPS_PORT=0 ise services/nginx.sh
    # "#https" ile biten satırları siler: arayüz yalnız HTTP'de kalır (ekran yansıtma çalışmaz).
    listen __HTTPS_PORT__ ssl default_server; #https
    http2 on; #https
    ssl_certificate /data/tls/server.crt; #https
    ssl_certificate_key /data/tls/server.key; #https
    ssl_protocols TLSv1.2 TLSv1.3; #https
    ssl_session_cache shared:SSL:2m; #https
    server_name _;
    root /var/www/ankamon;
    index index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Tarayıcılar düz HTTP'den HTTPS'e gönderilir; konteyner sağlık denetimi (/api/health, /healthz) ve
    # yerel CA'nın indirilmesi (/ankamon-ca.crt — HTTPS'e güvenmeden önce alınabilsin) HTTP'de kalır.
    # 302 (kalıcı değil): HTTPS kapatılırsa tarayıcılar eski yönlendirmeyi önbellekte tutmasın.
    set $tm_to_https ""; #https
    if ($scheme = http) { set $tm_to_https 1; } #https
    if ($uri ~ ^/(api/health|healthz|ankamon-ca\.crt)$) { set $tm_to_https ""; } #https
    if ($tm_to_https) { return 302 https://$host__HTTPS_SUFFIX__$request_uri; } #https

    location = /ankamon-ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="ankamon-ca.crt"';
        alias /data/tls/ca.crt;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Uygulama dosyalarının adı derlemeden derlemeye değişmiyor (ankamon/index.js); Cache-Control
    # olmadan tarayıcı sezgisel önbellekle eski JS'i sunucuya sormadan kullanıyor, yeni sürüm
    # görünmüyordu. "expires -1" → Cache-Control: no-cache: her açılışta ETag ile sorulur, dosya
    # değişmediyse 304 döner (ek yük yok). add_header yerine expires: sunucu düzeyindeki güvenlik
    # başlıklarının (add_header) bu konumlara kalıtımı bozulmasın.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_pass 127.0.0.1:9000;
        # Arka uç (PHP-FPM) yoksa/yanıt vermezse nginx'in HTML hata sayfası yerine arayüzün gösterebileceği
        # ayrıntılı JSON (bkz. frontend io/Api.js). Tipik neden: konteyner/servis yeni başlıyor — PHP-FPM
        # veritabanını beklerken birkaç saniye bağlantı kabul etmez.
        error_page 502 = @api_502;
        error_page 504 = @api_504;
    }
    location @api_502 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 3 always;
        return 502 '{"error":"API hizmetine bağlanılamadı (502).","detail":"nginx, PHP-FPM arka ucuna ($upstream_addr) bağlanamadı ya da bağlantı kesildi. Sunucu ya da API hizmeti yeni başlıyor/yeniden başlıyor olabilir; birkaç saniye sonra yeniden deneyin. Sürüyorsa sunucuda: docker compose logs --tail=100","request":"$request_method $request_uri","upstream":"$upstream_addr","upstream_status":"$upstream_status","time":"$time_iso8601"}';
    }
    location @api_504 {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":"API isteği zaman aşımına uğradı (504).","detail":"PHP-FPM arka ucu ($upstream_addr) zamanında yanıt vermedi; işlem çok uzun sürmüş ya da veritabanı meşgul olabilir.","request":"$request_method $request_uri","upstream":"$upstream_addr","upstream_status":"$upstream_status","time":"$time_iso8601"}';
    }

    # Ev dizini yedekleri (sağ menü "Yedekle"): yetki/sahiplik denetimini /api/home-backups/{id}
    # (HomeBackupApi) yapar, dosyayı X-Accel-Redirect ile buraya devreder — dışarıdan doğrudan erişilemez.
    location /_home-backups/ {
        internal;
        alias /data/home-backups/;
    }

    # Grafana isteklerinden önce oturum denetimi (yalnız nginx içinden çağrılır).
    location = /_auth/grafana {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/grafana;
        fastcgi_pass_request_body off;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Web terminal (webssh) — oturum + "shell" yetkisi olan kullanıcıya açık.
    location = /_auth/shell {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/shell;
        fastcgi_pass_request_body off;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Tek konum sayfayı, POST'u, WebSocket'i ve statik dosyaları kapsar (webssh göreli yol kullanır).
    location /webshell/ {
        auth_request /_auth/shell;
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1d;
    }

    # Çoklu web terminal: /webshell/ panolarını yan yana açan statik sayfa (bkz. BoardOps.webshellMulti).
    # Bağlantı bilgisi yalnız URL fragmanında (#...) taşınır, sunucuya hiç gelmez.
    # root (alias değil) kullanılır: location sonu "/" + global "index index.html" ile birlikte
    # alias kullanılsaydı yol "index.htmlindex.html" diye ikiye katlanıyordu.
    location /multishell/ {
        auth_request /_auth/shell;
        root /var/www;
        expires -1;
    }

    # Canlı tahta ekranı — oturum + "screen" yetkisi olan kullanıcıya açık.
    location = /_auth/screen {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/screen;
        fastcgi_pass_request_body off;
        fastcgi_pass 127.0.0.1:9000;
    }

    # İzleyici sayfası + noVNC istemci dosyaları (statik; /var/www/screen).
    location /screen/ {
        auth_request /_auth/screen;
        root /var/www;
        expires -1;
    }

    # Görev yöneticisi (Tahtalar/Ekranlar sağ menüsü): ekran köprüsündeki canlı SSH + tahta ajanı WebSocket'i.
    # Süreç sonlandırma/hizmet durdurma root yetkisiyle çalıştığından "screen" DEĞİL ayrı "taskmgr" yetkisi ister
    # (^~: /screen/ws/ yolundan önce eşleşir). Kullanıcı adı audit kaydı için oturumdan gelir.
    location = /_auth/taskmgr {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/taskmgr;
        fastcgi_pass_request_body off;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /screen/ws/taskmgr/ {
        auth_request /_auth/taskmgr;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    # RFB akışı: ekran köprüsüne (SSH → tahtadaki x11vnc) WebSocket. Kim izliyor bilgisi oturumdan gelir.
    location /screen/ws/ {
        auth_request /_auth/screen;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_control $upstream_http_x_auth_control;
        # İstemcinin gönderdiği aynı adlı başlıklar burada ezilir: kimlik ve yetki yalnız oturumdan gelir.
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Control $auth_control;
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    # Ekran yansıtma — oturum + "cast" yetkisi. Sayfa (statik, /var/www/cast) tarayıcıda ekranı yakalar
    # ve WHIP ile /cast/mtx/<yayın>/whip'e yollar; MediaMTX (services/mediamtx.sh) yalnız 127.0.0.1'den
    # yayın kabul eder, yani yalnız bu yetki denetimli vekil üzerinden. Medya (ICE, udp/tcp 8189) doğrudan
    # tarayıcı ↔ MediaMTX akar; tahtalar yayını RTSP (8554) ile okur.
    location = /_auth/cast {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/cast;
        fastcgi_pass_request_body off;
        fastcgi_pass 127.0.0.1:9000;
    }

    location /cast/ {
        auth_request /_auth/cast;
        root /var/www;
        expires -1;
    }

    # Yansıtma penceresinin tahta başına tüketim tablosu: tahtanın CPU/RAM'i + yansıtma oynatıcısının (mpv)
    # payı, saniyelik (ekran köprüsünün başarım akışı, bkz. worker/ankamon/screen/perf.py). YALNIZ başarım
    # yolu açılır ("screen" yetkisi gerektiren ekran görüntüsü/müdahale DEĞİL) — "cast" yetkisi yeterli.
    location ~ ^/cast/ws/perf/(\d+)$ {
        auth_request /_auth/cast;
        proxy_pass http://127.0.0.1:8890/screen/ws/perf/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    location /cast/mtx/ {
        auth_request /_auth/cast;
        proxy_pass http://127.0.0.1:__CAST_WEBRTC_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    # Dosya yöneticisi — oturum + "filemanager" yetkisi olan kullanıcıya açık. Çok dikkatli verilmeli:
    # tahtanın TÜM dosya sistemine root erişimi (gezinme, indirme, yükleme) demektir.
    location = /_auth/filemanager {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/filemanager;
        fastcgi_pass_request_body off;
        # Gövde PHP'ye gitmez ama nginx alt istekte de sunucu düzeyindeki 8m sınırını uygular: büyük
        # yüklemelerde (Dosyaları dağıt — 1 GB .mov) yetki denetimi 413 verip isteği 500'e çeviriyordu.
        client_max_body_size 0;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Açılış köprüsü: tahtayı bağlar (bkz. /filemanager-mount), sonra /filemanager/'a yönlendirir.
    location /filemanager-open/ {
        auth_request /_auth/filemanager;
        root /var/www;
        expires -1;
    }

    # Köprü: tahtayı sshfs ile bağlar (worker/ankamon/filemanager). Yalnız açılış sayfası çağırır.
    # Kim bağladığı (X-Auth-User) komut loguna işlensin diye oturumdan geçirilir.
    location /filemanager-mount/ {
        auth_request /_auth/filemanager;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        rewrite ^/filemanager-mount(/.*)$ $1 break;
        proxy_set_header X-Auth-User $auth_user;
        proxy_pass http://127.0.0.1:8894;
        proxy_set_header Host $http_host;
    }

    # İki panelli dosya gezgini ("Bilgisayarlar arasında kopyala" — bkz. worker/ankamon/files): listeleme, silme,
    # ad değiştirme, tahtadan tahtaya kopyalama. Dosya yöneticisiyle aynı yetki (tüm dosya sistemine
    # root erişim). Kim yaptı (X-Auth-User) oturumdan gelir, istemcininki ezilir.
    location /files-api/ {
        auth_request /_auth/filemanager;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;
        proxy_pass http://127.0.0.1:8895/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 10m;
        # Toplu dağıtma yüklemeleri (PUT /bulk/upload/…) ve toplananların ZIP/tar.gz indirmesi büyük olabilir:
        # gövde sınırsız, iki yönde de nginx'te arabelleğe alınmadan akar (diske ara kopya yazılmaz).
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # FileBrowser Quantum: gezinme, önizleme, indirme, yükleme. Kimlik doğrulaması burada yalnız
    # sabit bir başlıktır (proxy kimlik doğrulaması) — gerçek yetki denetimi auth_request'te yapıldı;
    # FileBrowser'ın kendi (tahtadan bağımsız) tek bir paylaşılan hesabı vardır. Yüklemeler büyük
    # olabileceğinden gövde boyutu sınırsız, istek gövdesi arabelleğe alınmadan doğrudan akar.
    location /filemanager/ {
        include /etc/nginx/filemanager-proxy.conf;
        proxy_pass http://127.0.0.1:8893;
    }

    # Tahtada sahiplik (bkz. worker/ankamon/filemanager/writes.py): FileBrowser root olarak yazar, kopyalanan/
    # yüklenen/kaydedilen her şey root sahipli olurdu. Kopyala/taşı (PATCH) ve düzenleyiciyle kaydetme (PUT)
    # köprüden geçer (8894 — iletip sahibi düzeltir); yüklemeler (POST, büyük gövde) doğrudan akar, biten her
    # yükleme köprünün syslog soketine bir satırla bildirilir.
    location = /filemanager/api/resources {
        include /etc/nginx/filemanager-proxy.conf;
        proxy_pass http://$fm_resources_upstream;
        access_log /var/log/nginx/access.log main;
        access_log syslog:server=unix:/run/ankamon/filemanager-writes.sock,nohostname,tag=fbwrite fm_write if=$fm_upload;
    }
    location ~ ^/filemanager/api/resources/(archive|unarchive)$ {
        include /etc/nginx/filemanager-proxy.conf;
        proxy_pass http://127.0.0.1:8894;
    }

    location /grafana/ {
        auth_request /_auth/grafana;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        # İstemcinin gönderdiği aynı adlı başlıklar burada ezilir: kimlik yalnız oturumdan gelir.
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:3000;
    }
}
