# Tiha-Mon Telegraf (tek konteyner): tahtaların node_exporter uçlarını okur, yerel Postgres'e yazar.
# Tahta başına [[inputs.prometheus]] blokları worker tarafından /data/telegraf/targets.conf içine üretilir.

[agent]
  interval = "${SCRAPE_INTERVAL}"
  round_interval = true
  collection_jitter = "5s"
  flush_interval = "15s"
  flush_jitter = "5s"
  metric_batch_size = 5000
  metric_buffer_limit = 250000
  omit_hostname = true
  skip_processors_after_aggregators = true

# Hiç tahta yokken de Telegraf'ın çalışır kalması için (çıktısı reshape.star tarafından atılır).
[[inputs.internal]]
  collect_memstats = false

# node_exporter ölçümlerini süzer ve tek biçime indirir: metrics(board_id, name, <etiketler>) = value
[[processors.starlark]]
  script = "/etc/tiha-mon/reshape.star"

[[outputs.postgresql]]
  connection = "host=127.0.0.1 port=5432 user=tihamon password=${PG_PASSWORD} dbname=tihamon sslmode=disable"
  tags_as_foreign_keys = true
  timestamp_column_type = "timestamp with time zone"
  create_templates = []
  tag_cache_size = 200000
