; Tek konteyner içindeki bütün süreçleri yönetir. Günlükler konteyner çıktısına (stdout/stderr) gider.
; Sıra: postgres (10) → dbinit (20, tek sefer) → diğer servisler (30+, /run/ankamon/db-ready bayrağını bekler).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; supervisorctl ile tek tek süreçleri yönetebilmek için yerel soket.
[unix_http_server]
file=/run/supervisor.sock
; Sistem sayfası (yalnız yönetici; backend Core\Supervisor) servis durumunu XML-RPC ile bu soketten
; okur/yönetir: PHP-FPM "nobody" olarak çalıştığından soket yalnız o gruba açılır. Ağ soketi
; (inet_http_server) BİLEREK yok — konteyner host ağında, port LAN'a açılırdı.
chown=root:nobody
chmod=0770

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
command=/opt/ankamon/services/postgres.sh
priority=10
autorestart=true
startsecs=5
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dbinit]
command=/opt/ankamon/services/dbinit.sh
priority=20
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rsyslog]
command=/opt/ankamon/services/rsyslog.sh
priority=30
autorestart=true
; Düzgün kapanışta rsyslog, veritabanı erişilemezken denemekte olduğu partiyi iptal edip kaybeder;
; bu yüzden SIGKILL ile durdurulur (disk kuyruğu her kayıtta denetim noktası aldığı için kayıpsız).
stopsignal=KILL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telegraf]
command=/opt/ankamon/services/telegraf.sh
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:grafana]
