<html lang="tr">
<head>
<meta charset="utf-8">
<title>Dosya yöneticisi</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .msg { text-align: center; max-width: 28em; padding: 0 1em; }
  .err { color: #c62828; }
</style>
</head>
<body>
<div class="msg" id="msg">Bağlanılıyor…</div>
<script>
(function () {
  // Bağlantı bilgisi BoardOps.filemanager()'dan gelir: yalnız tahta kimliği (+ başlık için host/ad).
  // Kimlik bilgisi tarayıcıya hiç gelmez — bağlama köprüsü onu kendisi veritabanından okur.
  var q = new URLSearchParams(location.search);
  var board = q.get("board"), hostname = q.get("hostname"), title = q.get("title") || hostname || board;
  document.title = "Dosya yöneticisi — " + title;
  var msg = document.getElementById("msg");
  function fail(text) { msg.className = "err"; msg.textContent = text; }
  if (!board) {
    fail("Eksik bağlantı bilgisi."); return;
  }

  // Ankamon'da kaydedilen tema dosya yöneticisine de uygulanır (kullanıcı isteği): kullanıcının
  // FileBrowser hesabına (bkz. nginx-default.conf — hesap kullanıcıya özel) aynı anahtarlı tema yazılır.
  // Anahtarlar services/filemanager.sh customThemes ile aynı; yalnız Ankamon'un varsayılanı (blue-light)
  // orada "default". Koyu temalar FileBrowser'ın koyu kipiyle birlikte kullanılır. Eşitlenemezse
  // (ağ/API hatası) dosya yöneticisi yine açılır — tema yalnız bir tercih.
  var DARK = ["blue-dark", "purple-dark", "qx-indigo-dark", "qx-tangible-dark", "fluent-dark",
              "darktheme", "bernstein", "macos-dark", "gnome-dark"];
  function syncTheme() {
    var json = function (r) { if (!r.ok) throw new Error(r.status); return r.json(); };
    return fetch("/api/auth/me", { headers: { "X-Requested-With": "ankamon" } }).then(json).then(function (me) {
      var theme = (me.user || me).theme || "blue-light";
      var key = theme === "blue-light" ? "default" : theme;
      var dark = DARK.indexOf(theme) !== -1;
      // FileBrowser 2.x: kendi hesabı ?username=self ile okunur, sorgusuz PATCH oturumdaki kullanıcıyı günceller.
      return fetch("/filemanager/api/users?username=self").then(json).then(function (fb) {
        if (fb.customTheme === key && !!fb.darkMode === dark) return;
        return fetch("/filemanager/api/users", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ which: ["customTheme", "darkMode"], data: { customTheme: key, darkMode: dark } })
        });
      });
    }).catch(function () { /* tema eşitlenemedi — dosya yöneticisi yine açılsın */ });
  }

  // 1) Tahtayı bu makineye bağla (sshfs; idempotent — zaten bağlıysa anında döner).
  fetch("/filemanager-mount/mount/" + encodeURIComponent(board), {
    method: "POST",
    headers: { "X-Requested-With": "ankamon" }
  }).then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
    .then(function (res) {
      if (!res.ok || !res.data.ok) {
        throw new Error((res.data && res.data.error) || "Bağlanılamadı.");
      }
      return syncTheme().then(function () { return res; });
    })
    .then(function (res) {
      // 2) FileBrowser Quantum'un o anki tahtanın dizinine girer; parola/kimlik bilgisi FileBrowser'a
      // hiç gitmez (nginx her isteğe oturumdaki kullanıcı adını X-Auth-User olarak ekliyor).
      // "tahtalar" kaynağın adı (bkz. services/filemanager.sh), res.data.path "<takma ad>/" (boşluk,
      // Türkçe karakter içerebilir; kodlanır). Açılış dizini tahtanın /home'u (kullanıcı isteği);
      // kökten yukarı gezinmek yine serbest.
      location.replace("/filemanager/files/tahtalar/" +
        encodeURIComponent(res.data.path.replace(/\/$/, "")) + "/home/");
    })
    .catch(function (e) {
      fail("Dosya yöneticisi açılamadı: " + e.message);
    });
})();
</script>
</body>
</html>
