; Tiha-Mon PHP-FPM. Tek havuz, 127.0.0.1:9000; nginx buraya bağlanır.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = nobody
group = nobody
listen = 127.0.0.1:9000
; Ortam değişkenleri (PG_*, parolalar) PHP'ye geçsin.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
