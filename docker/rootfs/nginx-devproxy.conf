# Varlıklar ▸ "Web arayüzünü aç" ters vekili (bkz. backend Api\DeviceWebProxyApi). Ayrı portta (DEVPROXY_PORT, vars. 8444)
# sayfanın KÖKÜNDEN yayın yapar: cihaz arayüzlerinin mutlak yolları (/login.html …) yol öneki olmadan çalışır. Hedef
# (şema|ip|port|imza) ankamon_devproxy çerezinde; her istek /api/auth/devproxy'ye sorulur (oturum + "network" yetkisi + imza +
# hedef envanterde) — keyfi adrese vekil yok. services/nginx.sh bu dosyayı /etc/nginx/http.d/devproxy.conf'a yazar
# (HTTPS kapalıysa ssl satırları düşer).

# Ankamon çerezleri (oturum anahtarı ve vekil hedefi) cihaza iletilmez.
map $http_cookie $ankamon_devproxy_cookie1 {
    "~^(?<pre>.*?)(?:^|;\s*)ankamon_sid=[^;]*(?<post>.*)$" "$pre$post";
    default $http_cookie;
}
map $ankamon_devproxy_cookie1 $ankamon_devproxy_cookie {
    "~^(?<pre>.*?)(?:^|;\s*)ankamon_devproxy=[^;]*(?<post>.*)$" "$pre$post";
    default $ankamon_devproxy_cookie1;
}
map $http_upgrade $ankamon_devproxy_connection {
    default upgrade;
    "" close;
}

server {
    listen __DEVPROXY_PORT__ ssl; #https
    listen __DEVPROXY_PORT__; #nohttps
    ssl_certificate /data/tls/server.crt; #https
    ssl_certificate_key /data/tls/server.key; #https
    server_name _;
    client_max_body_size 64m;

    location = /_auth/devproxy {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/ankamon/app/public/index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /api/auth/devproxy;
        fastcgi_pass_request_body off;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        auth_request /_auth/devproxy;
        auth_request_set $ankamon_devproxy_target $upstream_http_x_proxy_target;
        # Hedef IP adresi (çözümleyici gerekmez); istek yolu olduğu gibi iletilir.
        proxy_pass $ankamon_devproxy_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ankamon_devproxy_connection;
        proxy_set_header Cookie $ankamon_devproxy_cookie;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_read_timeout 300s;
        # Cihazın yönlendirmeleri (Location: http://<ip>:<port>/…) vekilin kendi köküne.
        proxy_redirect ~^https?://[^/]+(/.*)?$ $1;
        # Arayüz penceresinde (iframe) gösterilebilsin.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    error_page 401 403 = @ankamon_devproxy_denied;
    location @ankamon_devproxy_denied {
        default_type text/html;
        return 403 '<!doctype html><meta charset="utf-8"><body style="font-family:sans-serif;padding:2em">Bu web arayüzü vekili yalnız Ankamon\'dan (Ağ ▸ Varlıklar ▸ Web arayüzünü aç) açılır; oturum açık ve "Ağ" yetkisi olmalı.</body>';
    }
}
