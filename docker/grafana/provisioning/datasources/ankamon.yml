apiVersion: 1

datasources:
  - name: Ankamon
    uid: ankamon
    type: grafana-postgresql-datasource
    access: proxy
    url: 127.0.0.1:5432
    user: ankamon_ro
    isDefault: true
    editable: false
    jsonData:
      database: ankamon
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 5
    secureJsonData:
      password: $ANKAMON_RO_PASSWORD
