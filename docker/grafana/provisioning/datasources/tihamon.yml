apiVersion: 1

datasources:
  - name: TihaMon
    uid: tihamon
    type: grafana-postgresql-datasource
    access: proxy
    url: 127.0.0.1:5432
    user: tihamon_ro
    isDefault: true
    editable: false
    jsonData:
      database: tihamon
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 5
    secureJsonData:
      password: $TIHAMON_RO_PASSWORD
