# Dosya yedeğinin (files-*.tar.gz, bkz. backup.sh files_backup) DIŞINDA kalan /data alt dizinleri — TEK KAYNAK:
# backup.sh bunu okur, Sistem ▸ Yedekler'in "Veri depoları" tablosu (backend Core\DataStores) da buradan gösterir.
# Burada OLMAYAN her /data alt dizini dosya yedeğine KENDİLİĞİNDEN girer (yeni veri deposu açılınca yedek dışı kalmasın).
# Biçim: <dizin adı><TAB><neden>
postgres	Veritabanının kendisi — içeriği yapılandırma ve tam yedeklerde (pg_dump) alınır; çalışan veritabanının dosyaları tutarlı kopyalanamaz
backups	Yedeklerin kendisi
home-backups	Cihaz ev dizini yedekleri: geçici (saklama süresi Ev dizini yedekleri ayarında), zaten bir yedektir
rsyslog	Log kuyruğu: veritabanına yazılmayı bekleyen geçici loglar (yazılınca tam yedeğe girer)
.exports	Disk kullanımı ▸ İndir'in geçici indirme dosyaları (60 dakikada silinir)
