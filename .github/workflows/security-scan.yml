# Haftalık güvenlik taraması: imaj sıfırdan (önbelleksiz, en güncel Alpine paketleriyle) derlenir ve
# Trivy ile taranır. Yaması çıkmış HIGH/CRITICAL açık varsa "security-scan" etiketli tek bir issue
# açılır/güncellenir; temizlenince kendiliğinden kapanır. PR'larda (ör. Dependabot) yalnız rapor üretir.
name: security-scan

on:
  schedule:
    - cron: "17 3 * * 1"   # her pazartesi 03:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ["Dockerfile", "docker/**", ".github/trivy/**", ".github/workflows/security-scan.yml"]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      SEVERITY: HIGH,CRITICAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: İmajı önbelleksiz derle
        run: docker build --pull --no-cache -t ankamon:scan .

      - name: Trivy ile tara
        id: trivy
        run: |
          docker build -q -t trivy-pinned .github/trivy
          mkdir -p out trivy-cache
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-cache:/root/.cache/trivy" -v "$PWD/out:/out" trivy-pinned "$@"
          }
          common="image --scanners vuln --ignore-unfixed --severity $SEVERITY --no-progress --timeout 30m --skip-version-check"
          trivy $common --format json --output /out/trivy.json ankamon:scan
          trivy convert --format table --output /out/trivy.txt /out/trivy.json
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' out/trivy.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Trivy: yaması çıkmış $SEVERITY açık sayısı: $count"
            echo '```'; head -c 60000 out/trivy.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: out/
          retention-days: 30

      - name: Issue aç / güncelle / kapat
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.trivy.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create security-scan --color B60205 \
            --description "Haftalık Trivy taraması" --force >/dev/null
          open=$(gh issue list --label security-scan --state open --json number --jq '.[0].number // empty')
          if [ "$COUNT" -gt 0 ]; then
            {
              echo "Haftalık tarama, imajda **yaması çıkmış $COUNT adet $SEVERITY açık** buldu."
              echo
              echo "Düzeltme çoğunlukla taban imaj/paket sürümünü yükseltmek ve yeni bir commit atmaktır;"
              echo "kurulumlar \`install.sh --update\` ile alır. Tam rapor: $RUN_URL"
              echo
              echo '```'; head -c 55000 out/trivy.txt; echo '```'
            } > body.md
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file body.md
              gh issue comment "$open" --body "Tarama yinelendi: $COUNT açık sürüyor. $RUN_URL"
            else
              gh issue create --label security-scan \
                --title "Güvenlik taraması: yaması çıkmış $SEVERITY açıklar" --body-file body.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Son taramada yaması çıkmış $SEVERITY açık kalmadı. $RUN_URL"
          fi
