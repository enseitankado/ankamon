<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ankamon — Pardus İzleme ve Yönetim Merkezi</title>
  <style>
    :root {
      --boot-bg: #f3f5f8; --boot-fg: #1f2b3a; --boot-muted: #8a94a6;
      --boot-accent: #2f6df0; --boot-track: #e2e7ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-bg: #0f141b; --boot-fg: #e7ecf3; --boot-muted: #7d8798;
        --boot-accent: #5b8cff; --boot-track: #1d2530;
      }
    }
    html, body { margin: 0; height: 100%; background: var(--boot-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; color: var(--boot-fg); }
    #boot .wm { font-size: 30px; font-weight: 600; letter-spacing: .24em;
      padding-left: .24em; text-transform: uppercase; opacity: 0;
      animation: boot-fade .7s ease .05s forwards; }
    #boot .bar { position: relative; width: 190px; height: 2px; border-radius: 2px;
      background: var(--boot-track); overflow: hidden; }
    #boot .bar::before { content: ""; position: absolute; top: 0; left: 0; height: 100%;
      width: 38%; border-radius: 2px; background: var(--boot-accent);
      animation: boot-slide 1.15s cubic-bezier(.45,0,.2,1) infinite; }
    #boot .lbl { font-size: 12.5px; letter-spacing: .05em; color: var(--boot-muted);
      opacity: 0; animation: boot-fade .7s ease .2s forwards; }
    @keyframes boot-fade { to { opacity: 1; } }
    @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(520%); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .wm, #boot .lbl { animation: none; opacity: 1; }
      #boot .bar::before { animation: none; width: 100%; }
    }
  </style>
  ${preBootJs}
  <script src="${appPath}index.js" defer></script>
</head>
<body>
  <div id="boot">
    <div class="wm">Ankamon</div>
    <div class="bar" role="progressbar" aria-label="Yükleniyor"></div>
    <div class="lbl">yükleniyor…</div>
  </div>
  <noscript>Ankamon arayüzü için JavaScript gereklidir.</noscript>
</body>
</html>
